<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monstrobattle — Un jeu type Pokémon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <header id="topbar">
      <h1>Monstrobattle</h1>
      <div id="hint">Flèches / ZQSD pour bouger · Entre dans les hautes herbes pour des rencontres</div>
    </header>

    <!-- Écran d'accueil / choix du starter -->
    <section id="start-screen" class="screen active">
      <h2>Choisis ton compagnon de départ</h2>
      <div id="starter-choices" class="starter-choices"></div>
    </section>

    <!-- Overworld -->
    <section id="world-screen" class="screen">
      <canvas id="map" width="480" height="480"></canvas>
      <div id="world-ui">
        <button id="btn-party">Équipe</button>
        <button id="btn-heal">Centre de soins</button>
        <span id="world-msg"></span>
      </div>
    </section>

    <!-- Combat -->
    <section id="battle-screen" class="screen">
      <div class="battle-field">
        <div class="enemy-side">
          <div class="mon-info" id="enemy-info"></div>
          <div class="mon-sprite" id="enemy-sprite"></div>
        </div>
        <div class="player-side">
          <div class="mon-sprite" id="player-sprite"></div>
          <div class="mon-info" id="player-info"></div>
        </div>
      </div>
      <div id="battle-log" class="battle-log"></div>
      <div id="battle-menu" class="battle-menu"></div>
    </section>

    <!-- Équipe -->
    <section id="party-screen" class="screen">
      <h2>Ton équipe</h2>
      <div id="party-list" class="party-list"></div>
      <button id="btn-close-party">Retour</button>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
