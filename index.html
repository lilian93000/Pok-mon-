<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walaxy — Automatisez votre prospection LinkedIn</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👽</text></svg>">
</head>
<body>
  <div class="app">

    <!-- ===== Barre latérale ===== -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <span class="logo-mark">👽</span>
        <span class="logo-text">Walaxy</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#/accueil" class="nav-item" data-route="accueil">
          <span class="nav-icon">🏠</span> Accueil
        </a>
        <a href="#/prospects" class="nav-item" data-route="prospects">
          <span class="nav-icon">👥</span> Prospects
        </a>
        <a href="#/campagnes" class="nav-item" data-route="campagnes">
          <span class="nav-icon">🚀</span> Campagnes
        </a>
        <a href="#/messagerie" class="nav-item" data-route="messagerie">
          <span class="nav-icon">💬</span> Messagerie
          <span class="nav-badge" id="badge-inbox"></span>
        </a>
        <a href="#/file" class="nav-item" data-route="file">
          <span class="nav-icon">⏳</span> File d'attente
          <span class="nav-badge" id="badge-queue"></span>
        </a>
        <a href="#/abonnement" class="nav-item" data-route="abonnement">
          <span class="nav-icon">💎</span> Abonnement
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar avatar-me">LB</div>
          <div class="user-card-info">
            <div class="user-card-name">Lilian B.</div>
            <div class="user-card-plan">Essai gratuit · 12 j restants</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===== Contenu principal ===== -->
    <main class="main" id="main">
      <!-- rendu par app.js -->
    </main>
  </div>

  <!-- Modale générique (assistant de campagne, import, etc.) -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toasts -->
  <div class="toasts" id="toasts"></div>

  <!-- Tooltip de graphique -->
  <div class="chart-tooltip" id="chart-tooltip" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
