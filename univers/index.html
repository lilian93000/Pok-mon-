<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Atlas cosmique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
/* Layout : carte plein écran, instruments posés aux bords comme sur une console d'observatoire.
   Un seul monde visuel (le vide spatial), donc palette sombre unique. */
:root {
  --void: #05070d;
  --panel: rgba(10, 14, 24, 0.82);
  --line: rgba(160, 176, 210, 0.18);
  --ink: #e8ecf4;
  --dim: #8d97ad;
  --accent: #f3c27a;
  --accent-ink: #1a1206;
  --field: #6fd8ff;
  --field-glow: rgba(111, 216, 255, 0.35);
  --font-display: "Michroma", "Eurostile", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--void);
  color: var(--ink);
  font: 14px/1.5 var(--font-body);
  overflow: hidden;
  touch-action: none;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#sky.dragging { cursor: grabbing; }

.hud { position: fixed; z-index: 2; }
.glass {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* En-tête */
#brand { top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; max-width: 520px; pointer-events: none; }
#brand h1 {
  font: 400 20px/1.2 var(--font-display);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin: 0;
  text-wrap: balance;
}
#brand p { margin: 4px 0 0; color: var(--dim); font-size: 13px; }

#search-box { top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; width: 280px; }
#search {
  width: 100%;
  padding: 9px 12px;
  font: 14px var(--font-body);
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  outline: none;
}
#search:focus { border-color: var(--accent); }
#results {
  margin-top: 6px;
  padding: 4px;
  max-height: 260px;
  overflow-y: auto;
}
#results button {
  display: flex; justify-content: space-between; gap: 12px;
  width: 100%; padding: 7px 8px;
  background: none; border: 0; border-radius: 6px;
  color: var(--ink); font: 13px var(--font-body); text-align: left; cursor: pointer;
}
#results button span:last-child { color: var(--dim); font-family: var(--font-data); font-size: 11px; white-space: nowrap; }
#results button:hover, #results button:focus-visible { background: rgba(243, 194, 122, 0.12); outline: none; }

/* Échelle des niveaux de zoom */
#levels {
  top: 50%; left: 16px; transform: translateY(-50%);
  padding: 10px 8px;
  display: flex; flex-direction: column; gap: 2px;
}
#levels .rail-title {
  font: 500 10px var(--font-data); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--dim); padding: 0 8px 6px;
}
#levels button {
  display: grid; grid-template-columns: 10px 1fr; align-items: center; column-gap: 10px;
  padding: 6px 10px 6px 8px;
  background: none; border: 0; border-radius: 6px;
  color: var(--dim); cursor: pointer; text-align: left;
}
#levels button .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; }
#levels button .name { font: 500 13px var(--font-body); color: inherit; }
#levels button .size { grid-column: 2; font: 11px var(--font-data); color: var(--dim); opacity: 0.8; }
#levels button:hover { color: var(--ink); background: rgba(255, 255, 255, 0.04); }
#levels button:focus-visible { outline: 1px solid var(--accent); }
#levels button.active { color: var(--accent); }
#levels button.active .dot { background: var(--accent); border-color: var(--accent); }

/* Barre d'échelle */
#scale { left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 10px 12px; font-family: var(--font-data); }
#scale-bar { height: 6px; border: 1px solid var(--ink); border-top: 0; width: 100px; margin-bottom: 6px; transition: width 0.15s; }
#scale-label { font-size: 12px; font-variant-numeric: tabular-nums; }
#view-width { font-size: 11px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }

/* Temps */
#time {
  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px;
}
#date { font: 500 13px var(--font-data); font-variant-numeric: tabular-nums; min-width: 92px; }
#time .speeds { display: flex; gap: 2px; }
#time button {
  padding: 5px 9px; border: 0; border-radius: 6px; background: none;
  color: var(--dim); font: 12px var(--font-data); cursor: pointer; white-space: nowrap;
}
#time button:hover { color: var(--ink); }
#time button:focus-visible { outline: 1px solid var(--accent); }
#time button.on { background: var(--accent); color: var(--accent-ink); }

/* Fiche de l'objet */
#panel {
  right: 16px; top: calc(70px + env(safe-area-inset-top, 0px));
  width: 320px; max-height: calc(100% - 170px);
  overflow-y: auto; padding: 18px 18px 16px;
}
#panel .kind { font: 500 10px var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
#panel h2 { font: 400 19px/1.3 var(--font-display); letter-spacing: 0.04em; margin: 6px 0 12px; text-wrap: balance; }
#panel dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 6px 14px; margin: 0 0 14px; font-size: 13px; }
#panel dt { color: var(--dim); }
#panel dd { margin: 0; font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 0; }
#panel p { margin: 0 0 10px; color: var(--ink); }
#panel .note { color: var(--dim); font-size: 12px; }
#panel .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
#panel .actions button {
  padding: 8px 12px; border-radius: 7px; cursor: pointer;
  font: 500 13px var(--font-body);
  border: 1px solid var(--line); background: none; color: var(--ink);
}
#panel .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#panel .actions button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#panel ul { margin: 0 0 10px; padding-left: 18px; color: var(--dim); font-size: 13px; }
#panel kbd { font: 11px var(--font-data); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--ink); }
#close {
  position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
  border: 0; border-radius: 6px; background: none; color: var(--dim); font-size: 18px; cursor: pointer;
}
#close:hover { color: var(--ink); }

/* Vue 3D */
#v3d { position: fixed; inset: 0; z-index: 4; background: var(--void); opacity: 0; transition: opacity 0.35s ease; }
#v3d.on { opacity: 1; }
#v3d canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#v3d canvas:active { cursor: grabbing; }
#v3d-back {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  padding: 9px 14px; border-radius: 8px; cursor: pointer;
  font: 500 13px var(--font-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line);
}
#v3d-back:hover { border-color: var(--accent); }
#v3d-back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#v3d-hint {
  position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  font: 11px var(--font-data); color: var(--dim); letter-spacing: 0.04em;
}
#v3d-loading {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 12px var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
}
#v3d-tools {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
}
#v3d-tools .tool {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 10px 16px 10px 12px; border-radius: 999px; cursor: pointer;
  font: 500 13px var(--font-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#v3d-compare .ico2 { width: 18px; height: 18px; position: relative; }
#v3d-compare .ico2::before, #v3d-compare .ico2::after { content: ""; position: absolute; bottom: 2px; border: 1.5px solid var(--dim); border-radius: 50%; }
#v3d-compare .ico2::before { left: 0; width: 12px; height: 12px; }
#v3d-compare .ico2::after { right: 0; width: 5px; height: 5px; }
#v3d-compare.on { border-color: var(--accent); box-shadow: 0 0 22px rgba(243, 194, 122, 0.3); }
#v3d-compare.on .ico2::before, #v3d-compare.on .ico2::after { border-color: var(--accent); }
#v3d-tools .tool:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#v3d-live {
  position: absolute; left: 50%; transform: translateX(-50%); top: calc(18px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: 8px;
  font: 11px var(--font-data); letter-spacing: 0.06em; color: var(--ink);
  padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
}
#v3d-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* En-tête : actions */
.brand-actions { display: flex; gap: 8px; margin-top: 10px; pointer-events: auto; }
.chip {
  white-space: nowrap;
  padding: 7px 12px; border-radius: 999px; cursor: pointer;
  font: 500 12px var(--font-body); color: var(--ink);
  background: var(--panel); border: 1px solid var(--line);
}
.chip.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] { border-color: var(--field); color: var(--field); }
.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Visite guidée */
#tour-bar, #light-bar {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  width: min(600px, calc(100% - 32px)); padding: 16px 18px 12px;
  animation: rise 0.5s ease both;
}
@keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } }
.tour-meta { display: flex; justify-content: space-between; gap: 12px; font: 500 10px var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
#tour-dist { color: var(--dim); letter-spacing: 0.06em; text-transform: none; font-size: 11px; }
#tour-title { font: 400 18px/1.3 var(--font-display); letter-spacing: 0.04em; margin: 6px 0 6px; text-wrap: balance; }
#tour-text { margin: 0 0 12px; font-size: 14.5px; line-height: 1.55; color: var(--ink); max-width: 62ch; }
.tour-progress { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.tour-progress i { display: block; height: 100%; width: 0; background: var(--accent); }
.tour-ctl { display: flex; gap: 6px; flex-wrap: wrap; }
.tour-ctl button {
  padding: 6px 11px; border-radius: 7px; cursor: pointer; font: 500 12px var(--font-body);
  color: var(--ink); background: none; border: 1px solid var(--line);
}
.tour-ctl button:hover { border-color: var(--accent); }
.tour-ctl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#tour-stop { margin-left: auto; color: var(--dim); }
body.touring #panel, body.touring #time, body.touring #levels, body.touring #v3d-hint, body.touring #v3d-field-info { display: none; }
body.lighting #panel, body.lighting #time, body.lighting #levels, body.lighting #search-box { display: none; }
@media (max-width: 760px) { body.lighting #scale { display: none; } }
#light-bar { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.lb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 8px; }
.lb-grid > div { min-width: 0; }
.lb-k { display: block; font: 500 10px var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
.lb-v { display: block; font: 400 19px/1.3 var(--font-display); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
#lb-speed { color: var(--dim); letter-spacing: 0.04em; text-transform: none; font-size: 11px; }
#lb-log { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 3px; font-size: 13px; color: var(--dim); min-height: 3.6em; }
#lb-log li:first-child { color: var(--ink); }
#lb-log li b { color: var(--field); font-weight: 500; }
#lb-log li.final { color: var(--ink); line-height: 1.5; }
.chip .short { display: none; }

#v3d-field .ico {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--dim); position: relative;
}
#v3d-field .ico::before, #v3d-field .ico::after {
  content: ""; position: absolute; top: 50%; left: 50%; border: 1.5px solid var(--dim); border-radius: 50%;
  transform: translate(-50%, -50%);
}
#v3d-field .ico::before { width: 8px; height: 16px; }
#v3d-field .ico::after { width: 2px; height: 2px; background: var(--dim); }
#v3d-field.on { border-color: var(--field); box-shadow: 0 0 22px var(--field-glow); }
#v3d-field.on .ico, #v3d-field.on .ico::before, #v3d-field.on .ico::after { border-color: var(--field); }
#v3d-field.on .ico::after { background: var(--field); }
#v3d-field:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#v3d-field-info {
  position: absolute; left: 16px; top: calc(66px + env(safe-area-inset-top, 0px));
  width: 300px; padding: 12px 14px; font-size: 12.5px; line-height: 1.5; color: var(--dim);
}
#v3d-field-info strong {
  display: block; margin-bottom: 4px;
  font: 500 10px var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; color: var(--field);
}
body.in3d #panel { z-index: 5; }
body.in3d #levels, body.in3d #scale, body.in3d #time, body.in3d #search-box, body.in3d #brand { visibility: hidden; }

@media (max-width: 760px) {
  body.in3d #panel { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 38%; }
  #v3d-hint { display: none; }
  #v3d-tools { left: auto; right: 16px; transform: none; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: auto; flex-direction: column; align-items: flex-end; }
  #v3d-tools .tool { padding: 7px 11px 7px 9px; font-size: 12px; }
  #v3d-live { top: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 16px; transform: none; }
  body.in3d #v3d-live { display: none; }
  #tour-bar, #light-bar { bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 12px 14px 10px; }
  .lb-v { font-size: 15px; }
  .chip .long { display: none; }
  .chip .short { display: inline; }
  #tour-title { font-size: 15px; }
  #tour-text { font-size: 13px; margin-bottom: 8px; }
  #brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .brand-actions { margin-top: 0; }
  .chip { padding: 6px 10px; font-size: 11px; }
  #btn-sound { display: none; }
  #v3d-field-info { display: none; }
  #brand { right: 16px; max-width: none; }
  #brand h1 { font-size: 15px; }
  #brand p { display: none; }
  #search-box { top: calc(48px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; width: auto; }
  #levels {
    top: auto; transform: none; left: 16px; right: 16px;
    bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    flex-direction: row; overflow-x: auto; padding: 6px; scrollbar-width: none;
  }
  #levels .rail-title { display: none; }
  #levels button { flex: 0 0 auto; grid-template-columns: 8px auto; column-gap: 7px; }
  #levels button .size { display: none; }
  #scale { bottom: calc(126px + env(safe-area-inset-bottom, 0px)); padding: 6px 10px; background: none; border: 0; backdrop-filter: none; }
  #time { left: 16px; right: 16px; transform: none; justify-content: space-between; }
  #time .speeds { overflow-x: auto; }
  #panel {
    left: 16px; right: 16px; width: auto; top: auto;
    bottom: calc(118px + env(safe-area-inset-bottom, 0px));
    max-height: 42%;
  }
  #panel.intro p, #panel.intro ul { display: none; }
  #panel.intro h2 { font-size: 15px; margin-bottom: 0; }
  #panel.intro .actions { margin-top: 10px; }
  #date { min-width: 0; white-space: nowrap; font-size: 12px; }
}
@media (max-height: 780px) and (min-width: 761px) {
  #levels { top: calc(50% + 36px); padding: 6px; }
  #levels .rail-title { padding-bottom: 2px; }
  #levels button { padding-block: 4px; }
  #levels button .size { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #scale-bar { transition: none; }
  #tour-bar { animation: none; }
  #v3d-live::before { animation: none; }
}
</style>
</head>
<body>
<canvas id="sky" aria-label="Carte interactive de l'univers"></canvas>

<header id="brand" class="hud">
  <h1>Atlas cosmique</h1>
  <p>De la Terre au bord de l'univers observable, à l'échelle.</p>
  <div class="brand-actions">
    <button type="button" id="btn-tour" class="chip primary">▶ Voyage guidé</button>
    <button type="button" id="btn-light" class="chip"><span class="long">✦ Voyage de la lumière</span><span class="short">✦ Lumière</span></button>
    <button type="button" id="btn-sound" class="chip" aria-pressed="false">Son : coupé</button>
  </div>
</header>

<div id="search-box" class="hud">
  <input id="search" type="search" placeholder="Chercher : Mars, Sirius, Andromède…" autocomplete="off" aria-label="Chercher un objet" />
  <div id="results" class="glass" hidden></div>
</div>

<nav id="levels" class="hud glass" aria-label="Niveaux d'échelle">
  <div class="rail-title">Échelles</div>
</nav>

<div id="scale" class="hud glass" aria-live="polite">
  <div id="scale-bar"></div>
  <div id="scale-label">—</div>
  <div id="view-width">—</div>
</div>

<div id="time" class="hud glass">
  <span id="date">—</span>
  <div class="speeds" role="group" aria-label="Vitesse du temps">
    <button type="button" data-speed="0" id="sp-pause">Pause</button>
    <button type="button" data-speed="0.0000115741" id="sp-real">Réel</button>
    <button type="button" data-speed="1" id="sp-day">1 j/s</button>
    <button type="button" data-speed="30" id="sp-month">1 mois/s</button>
    <button type="button" data-speed="365.25" id="sp-year">1 an/s</button>
  </div>
</div>

<aside id="panel" class="hud glass" aria-live="polite"></aside>

<div id="v3d" hidden>
  <canvas aria-label="Vue 3D interactive de l'astre"></canvas>
  <button type="button" id="v3d-back">← Retour à la carte</button>
  <div id="v3d-hint">Glisser pour tourner · molette ou pincement pour zoomer</div>
  <div id="v3d-tools">
    <button type="button" id="v3d-field" class="tool" aria-pressed="true" hidden><span class="ico" aria-hidden="true"></span>Champ magnétique</button>
    <button type="button" id="v3d-compare" class="tool" aria-pressed="false" hidden><span class="ico2" aria-hidden="true"></span>Comparer les tailles</button>
  </div>
  <div id="v3d-live" hidden></div>
  <div id="v3d-field-info" class="glass" hidden></div>
  <div id="v3d-loading" hidden>Génération…</div>
</div>

<section id="light-bar" class="glass" hidden aria-live="polite">
  <div class="tour-meta"><span>Voyage de la lumière · 299 792 km/s</span><span id="lb-speed"></span></div>
  <div class="lb-grid">
    <div><span class="lb-k">Temps écoulé</span><span id="lb-time" class="lb-v">0 s</span></div>
    <div><span class="lb-k">Distance parcourue</span><span id="lb-dist" class="lb-v">0 km</span></div>
  </div>
  <ol id="lb-log"></ol>
  <div class="tour-ctl">
    <button type="button" id="lb-pause">Pause</button>
    <button type="button" id="lb-restart" hidden>Recommencer</button>
    <button type="button" id="lb-stop">Quitter</button>
  </div>
</section>

<section id="tour-bar" class="glass" hidden aria-live="polite">
  <div class="tour-meta"><span id="tour-step">Voyage guidé</span><span id="tour-dist"></span></div>
  <h3 id="tour-title">—</h3>
  <p id="tour-text"></p>
  <div class="tour-progress"><i id="tour-prog"></i></div>
  <div class="tour-ctl">
    <button type="button" id="tour-prev" aria-label="Étape précédente">◀</button>
    <button type="button" id="tour-pause">Pause</button>
    <button type="button" id="tour-next">Suivant ▶</button>
    <button type="button" id="tour-stop">Quitter</button>
  </div>
</section>

<script>
"use strict";
/* =========================================================================
   Unités : la carte est en ANNÉES-LUMIÈRE (al).

// Direction approximative : on projette sur un plan selon l'ascension droite.
function polar(d, raHours) {
  const t = raHours * 15 * DEG;
  return [d * Math.cos(t), -d * Math.sin(t)];
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(rnd) { return Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd()); }
function hash(i, j, k, s) {
  let h = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k + 7, 1442695041) ^ Math.imul(s + 3, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// Équatorial → galactique (l, b en radians), pôle galactique J2000
function toGalactic(raH, decD) {
  const a = raH * 15 * DEG, d = decD * DEG, aG = 192.85948 * DEG, dG = 27.12825 * DEG, lN = 122.93192 * DEG;
  const sb = Math.sin(d) * Math.sin(dG) + Math.cos(d) * Math.cos(dG) * Math.cos(a - aG);
  const l = lN - Math.atan2(Math.cos(d) * Math.sin(a - aG), Math.sin(d) * Math.cos(dG) - Math.cos(d) * Math.sin(dG) * Math.cos(a - aG));
  return [l, Math.asin(sb)];
}
// Carte vue du pôle nord galactique : centre galactique en haut, sens de rotation (l = 90°) à gauche.
// La distance réelle est conservée, la direction est la longitude galactique réelle.
function galPos(d, l) { return [-d * Math.sin(l), -d * Math.cos(l)]; }
function skyPos(d, name, raFallback) {
  const c = SKY[name];
  if (!c) return polar(d, raFallback);
  return galPos(d, toGalactic(c[0], c[1])[0]);
}

// Position héliocentrique écliptique (UA) à partir de l'anomalie excentrique E
function keplerXY(k, d, Eoverride) {
  const T = d / 36525;
  const a = k[0] + k[6] * T, e = k[1] + k[7] * T, I = k[2] * DEG, L = k[3] + k[8] * T, w = k[4] + k[9] * T, O = k[5] * DEG;
  const om = (w - k[5]) * DEG;
  let E;
  if (Eoverride === undefined) {
    let M = ((L - w) % 360 + 540) % 360 - 180;
    M *= DEG;
    E = M + e * Math.sin(M);
    for (let i = 0; i < 6; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  } else E = Eoverride;
  const xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const co = Math.cos(om), so = Math.sin(om), cO = Math.cos(O), sO = Math.sin(O), cI = Math.cos(I);
  const x = (co * cO - so * sO * cI) * xp + (-so * cO - co * sO * cI) * yp;
  const y = (co * sO + so * cO * cI) * xp + (-so * sO + co * cO * cI) * yp;
  return [x * AU, -y * AU];
}

/* Modèle de la Voie lactée vue du pôle nord galactique (rotation horaire, bras traînants).
   4 bras logarithmiques (pas de 13°) ; le Soleil est entre le bras du Sagittaire et celui de Persée. */
const MWM = {
  b: Math.tan(13 * DEG), a0: 4200, rSun: 26670,
  barAngle: Math.PI / 2 + 27 * DEG, barLen: 13000,
  names: ["Bras de Persée", "Bras de la Règle et bras externe", "Bras de l'Écu-Croix", "Bras du Sagittaire-Carène"],
  // Persée et l'Écu-Croix sont les deux bras majeurs ; les bras partent des extrémités de la barre
  weight: [1, 0.6, 1, 0.65], rIn: 10500,

function genMilkyWay() {
  const rnd = mulberry32(42), N = 9000;
  const x = new Float32Array(N), y = new Float32Array(N), c = new Uint8Array(N), s = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let px, py, col;
    const u = rnd();
    if (u < 0.14) {           // bulbe et barre
      const rr = Math.abs(gauss(rnd)) * 3600, th = rnd() * Math.PI * 2;
      px = rr * Math.cos(th) * 1.8; py = rr * Math.sin(th) * 0.6;
      const ba = MWM.barAngle, cx = px * Math.cos(ba) - py * Math.sin(ba); py = px * Math.sin(ba) + py * Math.cos(ba); px = cx;
      col = 0;
    } else if (u < 0.8) {     // bras
      const arm = (rnd() * 4) | 0;
      if (rnd() > MWM.weight[arm]) { i--; continue; }
      const r = MWM.rIn + Math.pow(rnd(), 0.9) * 42000;
      const th = armAngle(r, arm) + gauss(rnd) * 0.06;
      const spread = r * 0.035 * gauss(rnd);
      px = (r + spread) * Math.cos(th); py = (r + spread) * Math.sin(th);
      col = rnd() < 0.07 ? 3 : (rnd() < 0.6 ? 1 : 2);
    } else if (u < 0.86) {    // bras d'Orion
      const t = gauss(rnd) * 3500, w = gauss(rnd) * 500;
      px = -GC[0] + SPUR_DIR[0] * t - SPUR_DIR[1] * w; py = -GC[1] + SPUR_DIR[1] * t + SPUR_DIR[0] * w;
      col = rnd() < 0.1 ? 3 : 1;
    } else {                  // disque diffus
      const r = -Math.log(1 - rnd() * 0.97) * 12000, th = rnd() * Math.PI * 2;
      px = r * Math.cos(th); py = r * Math.sin(th); col = 2;
    }
    x[i] = GC[0] + px; y[i] = GC[1] + py; c[i] = col; s[i] = 0.6 + rnd() * 1.1;
  }
  return { x, y, c, s, N, colors: ["255,214,160", "200,216,255", "255,240,220", "255,120,170"] };
}

  g.fillStyle = gr; g.fillRect(0, 0, N, N);

  g.globalCompositeOperation = "source-over";

    const r = MWM.rIn + Math.pow(rnd(), 0.9) * 38000, th = armAngle(r, arm) + 0.08 + gauss(rnd) * 0.04;

}

  const rnd = mulberry32(seed);

/* =========================================================================

function fmtNum(v) {
  const digits = v >= 100 ? 0 : v >= 10 ? 1 : 2;
  return new Intl.NumberFormat("fr-FR", { maximumSignificantDigits: 3, maximumFractionDigits: digits }).format(v);
}
function fmtLy(ly) {
  if (ly < 1e6) return fmtNum(ly) + " années-lumière";
  if (ly < 1e9) return fmtNum(ly / 1e6) + " millions d'années-lumière";
  return fmtNum(ly / 1e9) + " milliards d'années-lumière";
}
function fmtDist(ly) {
  const km = ly * KM_PER_LY, au = ly * AU_PER_LY;
  if (km < 3e6) return fmtNum(km) + " km";
  if (au < 10000) return fmtNum(au) + " UA";
  return fmtLy(ly);
}
function fmtPeriod(days) {
  return days < 800 ? fmtNum(days) + " jours" : fmtNum(days / 365.25) + " ans";
}
function fmtLight(years) {
  const s = years * 365.25 * 86400;
  if (s < 90) return fmtNum(s) + " secondes";
  if (s < 5400) return fmtNum(s / 60) + " minutes";
  if (s < 172800) return fmtNum(s / 3600) + " heures";
  if (years < 1) return fmtNum(s / 86400) + " jours";
  if (years < 1e6) return fmtNum(years) + " ans";
  if (years < 1e9) return fmtNum(years / 1e6) + " millions d'années";
  return fmtNum(years / 1e9) + " milliards d'années";
}

  if (km < 3e6) return [KM_PER_LY, "km"];
  if (au < 10000) return [AU_PER_LY, "UA"];
  if (ly < 1e6) return [1, "al"];
  if (ly < 1e9) return [1e-6, "millions d'al"];

    const j0 = Math.floor((cam.y - H / 2 * S) / T) - 1, j1 = Math.floor((cam.y + H / 2 * S) / T) + 1;

          const bend = (hash(i, j, k, sd + 10) - 0.5) * 0.5;
          const cx = (sx + mx) / 2 - (my - sy) * bend, cy = (sy + my) / 2 + (mx - sx) * bend;
          ctx.strokeStyle = `rgba(120,140,230,${(0.03 + bright * 0.12) * a * w})`;
          ctx.lineWidth = 1 + bright * 2.5;
          ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(cx, cy, mx, my); ctx.stroke();
          // galaxies le long du filament
          const nd = 3 + (bright * 14) | 0;
          ctx.fillStyle = `rgba(215,222,255,${(0.25 + bright * 0.5) * a * w})`;
          for (let q = 0; q < nd; q++) {
            const t = hash(i * 7 + q, j, k, sd + 20), u = 1 - t;
            const jx = (hash(i, j * 5 + q, k, sd + 30) - 0.5) * 6, jy = (hash(i + q, j, k * 3, sd + 40) - 0.5) * 6;
            tmp.push(u * u * sx + 2 * u * t * cx + t * t * mx + jx, u * u * sy + 2 * u * t * cy + t * t * my + jy);
          }
          for (let q = 0; q < tmp.length; q += 2) ctx.fillRect(tmp[q], tmp[q + 1], 1.2, 1.2);
          tmp.length = 0;
        }
        // amas au nœud
        if (n[2] > 0.08) {
          const rr = 2 + n[2] * 10;
          const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, rr * 2.4);
          gr.addColorStop(0, `rgba(255,236,210,${0.85 * a * w * Math.min(1, n[2] * 2)})`);
          gr.addColorStop(0.35, `rgba(220,190,255,${0.25 * a * w * n[2]})`);
          gr.addColorStop(1, "rgba(200,180,255,0)");
          ctx.fillStyle = gr; ctx.fillRect(sx - rr * 2.4, sy - rr * 2.4, rr * 4.8, rr * 4.8);
        }
      }
    }
  }
  ctx.restore();
}

function drawCMB() {

function drawMilkyWay() {
  const aImg = MWIMG ? smooth(0.7, 1.5, cam.l) * (1 - smooth(4.9, 5.5, cam.l)) : 0;
  const aPts = smooth(-0.6, 0.4, cam.l) * (1 - smooth(MWIMG ? 1.3 : 4.8, MWIMG ? 2.0 : 5.6, cam.l));
  if (aImg <= 0 && aPts <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  if (aImg > 0) {
    const [gx, gy] = toScreen(GC), sz = MWIMG.ext / S;
    ctx.globalAlpha = aImg;
    ctx.drawImage(MWIMG.canvas, gx - sz / 2, gy - sz / 2, sz, sz);
    ctx.globalAlpha = 1;
  }
  if (aPts > 0) {
    const scale = Math.min(2.2, Math.max(0.8, 400 / (100000 / S) * 1.6));
    for (let c = 0; c < 4; c++) {
      ctx.fillStyle = `rgba(${MW.colors[c]},${(c === 0 ? 0.55 : 0.4) * aPts})`;
      for (let i = 0; i < MW.N; i++) {
        if (MW.c[i] !== c) continue;
        const sx = (MW.x[i] - cam.x) / S + W / 2, sy = (MW.y[i] - cam.y) / S + H / 2;
        if (sx < -2 || sx > W + 2 || sy < -2 || sy > H + 2) continue;
        const s = MW.s[i] * scale;
        ctx.fillRect(sx, sy, s, s);
      }
    }
  }
  ctx.restore();
  // noms des bras spiraux
  const aL = smooth(1.3, 1.7, cam.l) * (1 - smooth(3.2, 3.6, cam.l));
  if (aL > 0.05) {
    MWM.names.forEach((n, k) => {
      const r = MWM.labelR[k], th = armAngle(r, k);
      const [x, y] = toScreen([GC[0] + r * Math.cos(th), GC[1] + r * Math.sin(th)]);
      if (onScreen(x, y, 0)) addLabel(n, x, y, 2.5, `rgba(170,190,255,${0.8 * aL})`, 0, "italic 11px IBM Plex Sans, system-ui, sans-serif");
    });
  }
  const aS = smooth(0.1, 0.5, cam.l) * (1 - smooth(1.9, 2.3, cam.l));
  if (aS > 0.05) {
    const [x, y] = toScreen([SPUR_DIR[0] * 2600, SPUR_DIR[1] * 2600]);
    if (onScreen(x, y, 0)) addLabel("Bras d'Orion (le nôtre)", x, y, 2.5, `rgba(170,190,255,${0.8 * aS})`, 0, "italic 11px IBM Plex Sans, system-ui, sans-serif");
  }
}

function drawBelt(belt, period, color, maxA, minPx, maxPx) {
  const rRef = belt.r[0] / S;
  const a = smooth(minPx, minPx * 2.5, rRef) * (1 - smooth(maxPx, maxPx * 3, rRef)) * maxA;
  if (a <= 0.01) return;
  const [ox, oy] = toScreen([0, 0]);
  const rot = period ? (simDays / period) * Math.PI * 2 : 0;
  ctx.fillStyle = `rgba(${color},${a})`;
  for (let i = 0; i < belt.n; i++) {
    const r = belt.r[i] / S, t = belt.a[i] + (period ? rot * Math.pow(belt.r[0] / belt.r[i], 1.5) : 0);
    const x = ox + r * Math.cos(t), y = oy - r * Math.sin(t);
    if (x < 0 || x > W || y < 0 || y > H) continue;
    ctx.fillRect(x, y, 1.2, 1.2);
  }
}

function glow(x, y, r, color, alpha) {
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, color); gr.addColorStop(1, "rgba(0,0,0,0)");
  ctx.globalAlpha = alpha;
  ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

function drawObject(o) {
  const p = posOf(o);
  const sepPx = o.sep / S;
  let a = o.kind === "sun" ? 1 : smooth(5, 14, sepPx);
  const isMW = o.id === "Voie lactée";
  if (isMW) a = smooth(2.6, 3.2, cam.l);
  if (o.kind === "cmb") a = smooth(6, 6.8, cam.l);
  if (o.kind === "sun") a = 1 - smooth(2.6, 3.2, cam.l);
  if (a <= 0.01) return;
  const [x, y] = toScreen(p);
  const physPx = (o.r || 0) / S;
  if (o.kind !== "cmb" && o.kind !== "super" && o.kind !== "void" && o.kind !== "region" && !onScreen(x, y, physPx + 40)) return;

  let hitR = 8, labelDy = 0, pri = 1, lc = null;
  ctx.globalAlpha = a;
  switch (o.kind) {
    case "sun": {
      const r = Math.max(physPx, 5);
      glow(x, y, r * 4 + 10, "rgba(255,200,110,0.6)", a);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#fff1cf"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      hitR = r + 6; labelDy = r + 14; pri = 9;
      break;
    }
    case "planet": {
      const r = Math.max(physPx, o.name === "Lune" || o.name === "Pluton" ? 2 : 3);
      if (o.ring && r > 3) {
        ctx.strokeStyle = "rgba(233,211,156,0.7)"; ctx.lineWidth = Math.max(1, r * 0.25);
        ctx.beginPath(); ctx.ellipse(x, y, r * 2.2, r * 0.8, -0.35, 0, Math.PI * 2); ctx.stroke();
      }
      // éclairée du côté du Soleil (vue de dessus : le terminateur est une droite)
      const [sunX, sunY] = toScreen([0, 0]);
      const ang = Math.atan2(sunY - y, sunX - x);
      if (r > 3.5) {
        ctx.fillStyle = shade(o.color);
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        const gr = ctx.createRadialGradient(x + Math.cos(ang) * r * 0.45, y + Math.sin(ang) * r * 0.45, r * 0.05, x, y, r * 1.05);
        gr.addColorStop(0, "#fff"); gr.addColorStop(0.25, o.color); gr.addColorStop(1, shade(o.color));
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(x, y, r, ang - Math.PI / 2, ang + Math.PI / 2); ctx.closePath(); ctx.fill();
        if (o.name === "Terre" || o.name === "Vénus") {
          ctx.strokeStyle = o.name === "Terre" ? "rgba(110,170,255,0.55)" : "rgba(255,230,170,0.45)";
          ctx.lineWidth = Math.max(1, r * 0.08);
          ctx.beginPath(); ctx.arc(x, y, r * 1.04, ang - Math.PI / 2, ang + Math.PI / 2); ctx.stroke();
        }
      } else {
        const gr = ctx.createRadialGradient(x + Math.cos(ang) * r * 0.4, y + Math.sin(ang) * r * 0.4, r * 0.1, x, y, r);
        gr.addColorStop(0, o.color); gr.addColorStop(1, shade(o.color));
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
      hitR = r + 7; labelDy = r + 13; pri = o.name === "Terre" ? 8 : 6;
      break;
    }
    case "probe": {
      ctx.fillStyle = o.color;
      ctx.beginPath(); ctx.moveTo(x, y - 4); ctx.lineTo(x + 4, y); ctx.lineTo(x, y + 4); ctx.lineTo(x - 4, y); ctx.fill();
      labelDy = 14; pri = 4; lc = "rgba(243,194,122,0.95)";
      break;
    }
    case "star": {
      const r = 1.5 + o.mag * 2.2;
      glow(x, y, r * 5, hexA(o.color, 0.55), a);
      ctx.globalAlpha = a;
      ctx.fillStyle = o.color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      labelDy = r + 12; pri = 2 + o.mag * 3;
      if (sepPx < 40) pri -= 3;
      break;
    }
    case "nebula": {
      const s = Math.max(physPx * 2, 14);
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(o.img, x - s / 2, y - s / 2, s, s);
      ctx.globalCompositeOperation = "source-over";
      labelDy = s / 3 + 12; pri = 3;
      break;
    }
    case "cluster": {
      const rnd = mulberry32(o.name.length * 31), rr = Math.max(physPx, 6);
      ctx.fillStyle = o.color;
      for (let i = 0; i < 26; i++) {
        const d = Math.abs(gauss(rnd)) * rr * 0.5, t = rnd() * 6.283;
        ctx.fillRect(x + Math.cos(t) * d, y + Math.sin(t) * d, 1.4, 1.4);
      }
      labelDy = rr + 12; pri = 3;
      break;
    }
    case "blackhole": {
      ctx.strokeStyle = o.color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fill();
      labelDy = 16; pri = o.name === "Sagittarius A*" ? 5 : 3;
      break;
    }
    case "galaxy": {
      const s = Math.max(o.imgExt ? o.imgExt / S : physPx * 2, o.tiny ? 5 : 9);
      ctx.save();
      if (isMW) ctx.globalAlpha = smooth(5.0, 5.4, cam.l);
      ctx.globalCompositeOperation = "lighter";
      ctx.translate(x, y); ctx.rotate(o.rot || 0); ctx.scale(1, o.tilt || 1);
      ctx.drawImage(o.img, -s / 2, -s / 2, s, s);
      ctx.restore();
      ctx.globalAlpha = a;
      hitR = Math.max(9, s * 0.35); labelDy = s * 0.35 + 12; pri = o.id === "Voie lactée" ? 8 : (o.tiny ? 2 : 4);
      break;
    }
    case "gcluster": {
      const rr = Math.max(physPx, 4);
      glow(x, y, rr * 1.2 + 6, "rgba(255,226,190,0.45)", a);
      ctx.globalAlpha = a;
      labelDy = Math.min(rr, 40) + 12; pri = 3; hitR = Math.max(10, Math.min(rr, 40));
      break;
    }
    case "quasar": {
      ctx.strokeStyle = "rgba(170,200,255,0.9)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 7, y); ctx.lineTo(x + 7, y); ctx.moveTo(x, y - 7); ctx.lineTo(x, y + 7); ctx.stroke();
      glow(x, y, 8, "rgba(200,220,255,0.9)", a);
      labelDy = 16; pri = 3;
      break;
    }
    case "region": case "super": case "void": case "cmb": {
      if (o.kind === "super" || o.kind === "void") {
        const R = physPx;
        if (R < 12 || R > Math.hypot(W, H) * 4) { ctx.globalAlpha = 1; return; }
        ctx.setLineDash(o.kind === "void" ? [3, 6] : [8, 6]);
        ctx.strokeStyle = o.kind === "void" ? "rgba(125,138,168,0.55)" : "rgba(243,194,122,0.4)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        if (o.kind === "void") { ctx.fillStyle = "rgba(5,7,13,0.55)"; ctx.fill(); }
        // étiquette sur le bord supérieur visible
        const ly = Math.max(40, y - R + 16);
        if (!onScreen(x, ly, 0)) { ctx.globalAlpha = 1; return; }
        hits.push({ o, x, y: ly - 4, r: 30 });
        addLabel(o.name, x, ly, 3, o.kind === "void" ? "rgba(160,170,200,0.9)" : "rgba(243,194,122,0.95)", 0);
        ctx.globalAlpha = 1;
        return;
      }
      if (o.kind === "cmb") {
        const [ox, oy] = toScreen([0, 0]), R = R_OBS / S;
        const lx = ox, ly = oy - R + 22;
        if (onScreen(lx, ly, 0)) {
          hits.push({ o, x: lx, y: ly - 4, r: 40 });
          addLabel("Fond diffus cosmologique · limite de l'univers observable", lx, ly, 7, "rgba(255,170,130,0.95)", 0);
        }
        ctx.globalAlpha = 1;
        return;
      }
      // zones du Système solaire : simple étiquette discrète
      if (physPx < 50 || physPx > minDim() * 1.6) { ctx.globalAlpha = 1; return; }
      hits.push({ o, x, y: y - 4, r: 26 });
      addLabel(o.name, x, y, 2, "rgba(160,180,220,0.75)", 0, "italic 11px IBM Plex Sans, system-ui, sans-serif");
      ctx.globalAlpha = 1;
      return;
    }
  }
  ctx.globalAlpha = 1;
  hits.push({ o, x, y, r: hitR });
  if (sepPx > (o.kind === "star" ? 26 : 18) || o.kind === "sun" || o.id === "Voie lactée") {
    addLabel(o.name, x, y, pri, lc, labelDy, o.kind === "sun" || o.id === "Voie lactée" || o.name === "Terre" ? "500 12.5px IBM Plex Sans, system-ui, sans-serif" : undefined);
  }
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.round(v * 0.35);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

function drawOrbits() {
  ctx.save();
  ctx.lineWidth = 1;
  for (const o of OBJECTS) {
    if (o.kind !== "planet") continue;
    const R = o.sep / S;
    const a = smooth(5, 16, R);
    if (a <= 0.01) continue;
    const c = o.parent ? toScreen(byId[o.parent].pos(simDays)) : toScreen([0, 0]);
    if (R > Math.hypot(W, H) * 6) continue;
    ctx.strokeStyle = `rgba(160,176,210,${(o === selected ? 0.55 : 0.18) * a})`;
    ctx.beginPath();
    if (o.kep) {
      // vraie ellipse képlérienne
      for (let i = 0; i <= 160; i++) {

      }
    } else ctx.arc(c[0], c[1], R, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSelection() {
  if (!selected) return;
  const h = hits.find((h) => h.o === selected);
  if (!h) return;
  const t = performance.now() / 1000;
  ctx.strokeStyle = "rgba(243,194,122,0.85)"; ctx.lineWidth = 1.2;
  const r = h.r + 4 + (reduceMotion ? 0 : Math.sin(t * 3) * 1.5);
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const a0 = i * Math.PI / 2 + Math.PI / 4;
    ctx.arc(h.x, h.y, r, a0 - 0.45, a0 + 0.45);
    ctx.moveTo(h.x + Math.cos(a0 + Math.PI / 2 - 0.45) * r, h.y + Math.sin(a0 + Math.PI / 2 - 0.45) * r);
  }
  ctx.stroke();
}

function drawLabels() {
  labels.sort((a, b) => b.pri - a.pri);
  const placed = [];
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const L of labels) {
    ctx.font = L.font;
    const w = ctx.measureText(L.text).width, h = 14;
    let x = L.x, y = L.y + L.dy;
    x = Math.min(W - w / 2 - 6, Math.max(w / 2 + 6, x));
    const box = [x - w / 2 - 3, y - h / 2, x + w / 2 + 3, y + h / 2];
    if (placed.some((b) => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    placed.push(box);
    ctx.fillStyle = "rgba(5,7,13,0.55)";
    ctx.fillText(L.text, x + 1, y + 1);
    ctx.fillStyle = L.color;
    ctx.fillText(L.text, x, y);
  }
  ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
}

function flyTo(target, radius, opts = {}) {

  const distPx = Math.hypot(p1[0] - cam.x, p1[1] - cam.y) / S;
  const lPeak = distPx > minDim() * 0.6 ? Math.log10(Math.hypot(p1[0] - cam.x, p1[1] - cam.y) / (minDim() * 0.4)) : -Infinity;
  const decades = Math.abs(l1 - cam.l) + Math.max(0, lPeak - Math.max(cam.l, l1)) * 2;
  flight = {
    t0: performance.now(), dur: reduceMotion ? 1 : Math.min(5200, 1100 + decades * 260),

    cam.l = F.l0 + (F.l1 - F.l0) * e;

  S = Math.pow(10, cam.l);
  const p1 = F.getPos();
  const w = (1 - e) * Math.min(1, S / Math.pow(10, F.l0));
  cam.x = p1[0] + (F.x0 - p1[0]) * w;
  cam.y = p1[1] + (F.y0 - p1[1]) * w;

  if (y <= 7e6) return "quand la lignée humaine se sépare de celle des chimpanzés";
  if (y <= 66e6) return "après la disparition des dinosaures, quand les mammifères se diversifient";

  const origin = byId.Terre.pos(simDays).slice();
  const marks = LIGHT_MARKS.map((n) => byId[n]).filter(Boolean).map((o) => ({ o, d: distFromEarth(o) })).sort((a, b) => a.d - b.d);
  light = { u: Math.log10(L_START), paused: false, done: false, marks, next: 0, origin, flash: [] };
  follow = null; flight = null;
  LB["lb-log"].innerHTML = "<li>Un rayon de lumière quitte la Terre. Rien ne va plus vite.</li>";
  LB["lb-pause"].textContent = "Pause"; LB["lb-pause"].hidden = false; LB["lb-restart"].hidden = true;
  document.body.classList.add("lighting");
  lightBar.hidden = false;
  Sound.cue();
}
function stopLight() {
  if (!light) return;
  light = null;
  document.body.classList.remove("lighting");
  lightBar.hidden = true;
}
function logLight(html, cls) {
  const li = document.createElement("li");
  li.innerHTML = html; if (cls) li.className = cls;
  LB["lb-log"].prepend(li);
  while (LB["lb-log"].children.length > 3) LB["lb-log"].lastChild.remove();
}
function stepLight(dt) {
  if (!light) return;
  if (!light.paused && !light.done) {
    light.u += LIGHT_RATE * dt;
    const d = Math.pow(10, light.u);
    while (light.next < light.marks.length && light.marks[light.next].d <= d) {
      const m = light.marks[light.next++];
      logLight(`✦ <b>${m.o.name}</b> · après ${fmtLight(m.d)}`);
      light.flash.push({ o: m.o, t: performance.now() });
      Sound.cue();
    }
    if (d >= L_END) {
      light.u = Math.log10(L_END); light.done = true;
      logLight("Un milliard d'années-lumière. Au-delà, l'expansion de l'univers change tout : un rayon parti aujourd'hui n'atteindra jamais les galaxies situées à plus d'environ 16 milliards d'années-lumière.", "final");
      LB["lb-pause"].hidden = true; LB["lb-restart"].hidden = false;
    }
  }
  const d = Math.pow(10, light.u);
  cam.l = Math.min(MAX_L, lFor(d * 1.3)); S = Math.pow(10, cam.l);
  const k = smooth(-6, -2, cam.l);
  cam.x = light.origin[0] * (1 - k); cam.y = light.origin[1] * (1 - k);
}
function drawLightFront() {
  if (!light) return;
  const d = Math.pow(10, light.u);
  const [ox, oy] = toScreen(light.origin), R = d / S;
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const gr = ctx.createRadialGradient(ox, oy, R * 0.9, ox, oy, R * 1.03);
  gr.addColorStop(0, "rgba(120,220,255,0)"); gr.addColorStop(0.85, "rgba(150,230,255,0.22)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(ox, oy, R * 1.03, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "rgba(200,245,255,0.85)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ox, oy, R, 0, Math.PI * 2); ctx.stroke();
  // éclat sur les astres atteints
  const now = performance.now();
  light.flash = light.flash.filter((f) => now - f.t < 1600);
  for (const f of light.flash) {
    const [x, y] = toScreen(posOf(f.o)), q = (now - f.t) / 1600;
    ctx.strokeStyle = `rgba(150,230,255,${0.9 * (1 - q)})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 6 + q * 40, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
  const tNow = performance.now();
  if (!light.hud || tNow - light.hud > 90) {
    light.hud = tNow;
    LB["lb-time"].textContent = fmtLight(d);
    LB["lb-dist"].textContent = fmtDist(d);
    LB["lb-speed"].textContent = light.done ? "arrivée" : "accéléré × " + fmtBig(d * Math.LN10 * LIGHT_RATE * 3.15576e7);
  }
}
document.getElementById("btn-light").addEventListener("click", startLight);
document.getElementById("lb-stop").addEventListener("click", stopLight);
document.getElementById("lb-restart").addEventListener("click", startLight);
LB["lb-pause"].addEventListener("click", () => {
  if (!light) return;
  light.paused = !light.paused;
  LB["lb-pause"].textContent = light.paused ? "Reprendre" : "Pause";
});

/* =========================================================================
   Ambiance sonore générée (Web Audio) : nappe grave, souffle, notes lointaines
   ========================================================================= */
const Sound = (() => {
  let ac = null, master = null, verb = null, on = false, timer = 0;
  const btn = document.getElementById("btn-sound");
  function init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    // réverbération : réponse impulsionnelle de bruit décroissant
    verb = ac.createConvolver();
    const len = ac.sampleRate * 5, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir;
    const wet = ac.createGain(); wet.gain.value = 0.6; verb.connect(wet); wet.connect(master);
    // nappe : quintes graves légèrement désaccordées, filtre qui respire
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 2;
    const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = 0.04; lfoG.gain.value = 260;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    [[55, "sine", 0.22], [82.41, "sine", 0.14], [110.3, "triangle", 0.06], [164.8, "sine", 0.05], [54.6, "sine", 0.18]].forEach(([f, t, g]) => {
      const o = ac.createOscillator(), gn = ac.createGain();
      o.type = t; o.frequency.value = f; gn.gain.value = g;
      o.connect(gn); gn.connect(lp); o.start();
    });
    lp.connect(master); lp.connect(verb);
    // souffle cosmique
    const nb = ac.createBuffer(1, ac.sampleRate * 4, ac.sampleRate), nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const ns = ac.createBufferSource(); ns.buffer = nb; ns.loop = true;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 500; bp.Q.value = 0.8;
    const nl = ac.createOscillator(), nlg = ac.createGain(); nl.frequency.value = 0.07; nlg.gain.value = 300; nl.connect(nlg); nlg.connect(bp.frequency); nl.start();
    const ng = ac.createGain(); ng.gain.value = 0.025;
    ns.connect(bp); bp.connect(ng); ng.connect(master); ng.connect(verb); ns.start();
    return true;
  }
  function bell(gain = 0.05) {
    if (!on) return;
    const scale = [220, 246.9, 293.7, 329.6, 392, 440, 493.9, 587.3, 659.3];
    const f = scale[(Math.random() * scale.length) | 0] * (Math.random() < 0.3 ? 2 : 1), t = ac.currentTime;
    [[1, 1], [2.01, 0.3], [3.02, 0.12]].forEach(([m, g]) => {
      const o = ac.createOscillator(), e = ac.createGain();
      o.frequency.value = f * m;
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(gain * g, t + 0.03);
      e.gain.exponentialRampToValueAtTime(0.0001, t + 5);
      o.connect(e); e.connect(verb); e.connect(master);
      o.start(t); o.stop(t + 5.1);
    });
  }
  function loop() { bell(); timer = setTimeout(loop, 3500 + Math.random() * 6000); }
  function set(v) {
    if (v && !ac && !init()) return;
    on = v;
    btn.setAttribute("aria-pressed", String(v));
    btn.textContent = v ? "Son : activé" : "Son : coupé";
    if (!ac) return;
    if (v) { ac.resume(); master.gain.setTargetAtTime(0.55, ac.currentTime, 1.5); clearTimeout(timer); timer = setTimeout(loop, 1500); }
    else { master.gain.setTargetAtTime(0, ac.currentTime, 0.4); clearTimeout(timer); }
  }
  btn.addEventListener("click", () => set(!on));
  return { set, cue: () => bell(0.08) };
})();

/* Recherche */
const search = document.getElementById("search"), results = document.getElementById("results");
const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
search.addEventListener("input", () => {
  const q = norm(search.value.trim());
  if (!q) { results.hidden = true; return; }
  const found = OBJECTS.filter((o) => norm(o.name).includes(q) || norm(o.label || "").includes(q)).slice(0, 8);
  results.innerHTML = found.length
    ? found.map((o, i) => `<button type="button" data-i="${OBJECTS.indexOf(o)}"><span>${o.name}</span><span>${o.distText ? "ici" : o.name === "Terre" ? "0 km" : fmtDist(distFromEarth(o))}</span></button>`).join("")
    : `<div style="padding:8px;color:var(--dim);font-size:13px">Aucun objet ne correspond à « ${search.value.replace(/[<>&]/g, "")} ».</div>`;
  results.hidden = false;
});
results.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  stopTour();
  explore(OBJECTS[+b.dataset.i]);
  results.hidden = true; search.value = ""; search.blur();
});
search.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { const b = results.querySelector("button"); if (b) b.click(); }
  if (e.key === "Escape") { results.hidden = true; search.blur(); }
});

/* Temps */
let speed = 1;
const speedBtns = [...document.querySelectorAll("#time button")];
function setSpeed(v) { speed = v; speedBtns.forEach((b) => b.classList.toggle("on", +b.dataset.speed === v)); }
speedBtns.forEach((b) => b.addEventListener("click", () => setSpeed(+b.dataset.speed)));
setSpeed(1);

/* =========================================================================
   Interactions
   ========================================================================= */
function zoomAt(mx, my, dl) {
  const nl = Math.min(MAX_L, Math.max(MIN_L, cam.l + dl));
  flight = null;
  if (follow) { cam.l = nl; S = Math.pow(10, nl); return; }
  const wx = cam.x + (mx - W / 2) * S, wy = cam.y + (my - H / 2) * S;
  cam.l = nl; S = Math.pow(10, nl);
  cam.x = wx - (mx - W / 2) * S; cam.y = wy - (my - H / 2) * S;
}
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const dy = e.deltaMode === 1 ? e.deltaY * 30 : e.deltaY;
  zoomAt(e.clientX, e.clientY, Math.max(-0.5, Math.min(0.5, dy * 0.0018)));
}, { passive: false });

const pointers = new Map();
let dragMoved = 0, pinch = null;
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragMoved = 0;
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), l: cam.l };
  }
  canvas.classList.add("dragging");
});
canvas.addEventListener("pointermove", (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const cur = { x: e.clientX, y: e.clientY };
  pointers.set(e.pointerId, cur);
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    const target = pinch.l - Math.log10(d / pinch.d);
    zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, target - cam.l);
    dragMoved += 10;
    return;
  }
  const dx = cur.x - prev.x, dy = cur.y - prev.y;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (dragMoved > 4) {
    flight = null; follow = null;
    cam.x -= dx * S; cam.y -= dy * S;
  }
});
function endPointer(e) {
  const wasTap = pointers.size === 1 && dragMoved <= 4;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) canvas.classList.remove("dragging");
  if (wasTap && e.type === "pointerup") pick(e.clientX, e.clientY);
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("dblclick", (e) => zoomAt(e.clientX, e.clientY, -0.6));

function pick(x, y) {
  let best = null, bd = Infinity;
  for (const h of hits) {
    const d = Math.hypot(h.x - x, h.y - y);
    if (d < Math.max(h.r, 14) && d < bd) { bd = d; best = h.o; }
  }
  if (best) { stopTour(); stopLight(); explore(best); }
}

window.addEventListener("keydown", (e) => {
  if (e.target === search) return;
  if (in3D() && e.key !== "Escape") return;
  const step = 60 * S;
  switch (e.key) {
    case "+": case "=": zoomAt(W / 2, H / 2, -0.25); break;
    case "-": case "_": zoomAt(W / 2, H / 2, 0.25); break;
    case "ArrowLeft": follow = null; flight = null; cam.x -= step; break;
    case "ArrowRight": follow = null; flight = null; cam.x += step; break;
    case "ArrowUp": follow = null; flight = null; cam.y -= step; break;
    case "ArrowDown": follow = null; flight = null; cam.y += step; break;
    case "Escape": if (light) stopLight(); else if (tour) stopTour(); else if (in3D()) { close3D(); } else intro(); break;
    default: return;
  }
  e.preventDefault();
});
window.addEventListener("resize", resize);

/* =========================================================================
   Boucle principale
   ========================================================================= */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  simDays += speed * dt;
  stepFlight(now);
  if (!flight && follow) { const p = posOf(follow); cam.x = p[0]; cam.y = p[1]; }
  if (light) stepLight(dt);
  S = Math.pow(10, cam.l);
  if (in3D()) { updateHud(now); requestAnimationFrame(frame); return; }

  ctx.fillStyle = "#05070d";
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.9;
  ctx.drawImage(bgStars, 0, 0, W, H);
  ctx.globalAlpha = 1;

  hits = []; labels = [];
  drawWeb();
  drawCMB();
  drawRings();
  drawMilkyWay();
  drawBelt(OORT, 0, "170,190,230", 0.35, 18, 4000);
  drawBelt(KUIPER, 0, "170,190,230", 0.5, 30, 1400);
  drawBelt(ASTEROIDS, 4.6 * 365.25, "200,190,170", 0.55, 20, 1600);
  drawOrbits();
  for (const o of OBJECTS) drawObject(o);
  drawLightFront();
  drawYouAreHere();
  drawCompass();
  drawSelection();
  drawLabels();
  updateHud(now);
  requestAnimationFrame(frame);
}

resize();
cam.l = lFor(LEVELS[2].r);
S = Math.pow(10, cam.l);
intro();
requestAnimationFrame(frame);
setTimeout(() => {
  MWIMG = genMilkyWayImage();
  window.ATLAS_MW = MWIMG;
  const mw = byId["Voie lactée"]; mw.img = MWIMG.canvas; mw.imgExt = MWIMG.ext; mw.rot = 0; mw.tilt = 1;
}, 250);
document.getElementById("v3d-back").addEventListener("click", () => {
  stopTour();
  close3D();
  if (selected) select(selected, false);
});
