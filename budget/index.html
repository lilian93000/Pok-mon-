<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Budget</title>
<meta name="description" content="Mon budget au jour le jour : importe ton relevé Revolut, suis tes dépenses et ton épargne.">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Mobile-first, une colonne. Couleurs : indigo (fixe), ambre (vie courante), rose (plaisir), vert (épargne). */
:root{
  --bg:#f2f3f8; --card:#ffffff; --ink:#0f1222; --muted:#6b7280; --line:#eceef4; --soft:#f4f5fa;
  --fix:#6366f1; --life:#f59e0b; --fun:#ec4899; --save:#10b981; --danger:#ef4444; --marge:#cbd5e1;
  --shadow:0 1px 2px rgba(15,18,34,.04),0 12px 32px -8px rgba(15,18,34,.10);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#090b12;--card:#131624;--ink:#f3f4f8;--muted:#9aa1b2;--line:#222638;--soft:#1a1e2e;--marge:#334155;--shadow:0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#090b12;--card:#131624;--ink:#f3f4f8;--muted:#9aa1b2;--line:#222638;--soft:#1a1e2e;--marge:#334155;--shadow:0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:130px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
button{font:inherit}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--fix);outline-offset:2px}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.15)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-25px,25px) scale(.9)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}50%{box-shadow:0 0 0 6px rgba(239,68,68,0)}}
@keyframes confetti{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(200%)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.anim{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px;gap:10px}
.top h1{font-size:28px;margin:0;font-weight:900;letter-spacing:-.035em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);border:1px solid var(--line);padding:5px 10px;border-radius:99px;margin-top:6px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--save);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.chip .dot.old{background:var(--life);box-shadow:0 0 0 3px rgba(245,158,11,.2)}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;transition:transform .2s var(--ease);flex:none}
.iconbtn:active{transform:scale(.9)}
.importbtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;background:var(--ink);color:var(--card);font-weight:700;font-size:14px;padding:0 14px;height:44px;cursor:pointer;transition:transform .2s var(--ease)}
.importbtn:active{transform:scale(.95)}

.card{background:var(--card);border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line);position:relative;overflow:hidden}
.h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.h .r{text-transform:none;letter-spacing:0;font-weight:600}

/* ---------- hero ---------- */
.hero{color:#fff;border:0;padding:24px 22px;background:linear-gradient(120deg,#4338ca,#7c3aed,#c026d3,#db2777,#7c3aed,#4338ca);background-size:300% 300%;animation:rise .7s var(--ease) both,shift 14s ease-in-out infinite}
.hero.green{background:linear-gradient(120deg,#065f46,#059669,#10b981,#34d399,#059669,#065f46);background-size:300% 300%}
.hero .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
.hero .b1{width:200px;height:200px;background:#60a5fa;top:-60px;right:-40px;animation:float1 9s ease-in-out infinite}
.hero .b2{width:160px;height:160px;background:#f472b6;bottom:-60px;left:-30px;animation:float2 11s ease-in-out infinite}
.hero .content{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.hero .lbl{font-size:14px;font-weight:500;opacity:.88}
.hero .big{font-size:58px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0 8px}
.hero .sub{font-size:13px;opacity:.92;max-width:270px}
.ring{width:112px;height:112px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#fff;transition:stroke-dashoffset 1.4s var(--ease)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2;opacity:.95}
.ring .in b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.hero .foot{position:relative;display:flex;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22);font-size:13px;gap:10px}
.hero .foot b{display:block;font-size:17px;font-weight:800}

/* ---------- blocs ---------- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini .t{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center}
.mini .v{font-size:28px;font-weight:900;letter-spacing:-.03em;margin:6px 0 10px;white-space:nowrap}
.mini .s{font-size:12px;color:var(--muted);margin-top:8px}
.bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1.2s var(--ease)}
.save{cursor:pointer;user-select:none;transition:transform .25s var(--ease)}
.save:active{transform:scale(.97)}
.save .box{width:46px;height:46px;border-radius:15px;border:2.5px dashed var(--save);display:grid;place-items:center;font-size:22px;margin:6px 0 10px;color:transparent;transition:all .35s var(--ease)}
.save.on .box{background:var(--save);border:2.5px solid var(--save);color:#fff;animation:pop .45s var(--ease)}
.save.on{background:linear-gradient(160deg,rgba(16,185,129,.12),transparent 60%),var(--card)}
.conf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:99;animation:confetti 1s var(--ease) forwards}

.proj .big3{font-size:34px;font-weight:900;letter-spacing:-.03em;margin:2px 0 10px}
.proj .marker{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:3px;background:var(--ink)}
.amount{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:16px;padding:4px 14px}
.amount input{flex:1;border:0;background:none;font-size:30px;font-weight:900;width:100%;outline:none;padding:6px 0;letter-spacing:-.02em}
.amount span{font-size:26px;font-weight:900;color:var(--muted)}
.verdict{margin-top:12px;border-radius:16px;padding:14px;font-size:14px;animation:rise .45s var(--ease)}
.verdict b.big2{display:block;font-size:17px;margin-bottom:4px}
.verdict.ok{background:rgba(16,185,129,.12)} .verdict.ko{background:rgba(239,68,68,.10)} .verdict.mid{background:rgba(245,158,11,.13)}
.verdict ul{margin:8px 0 0;padding-left:18px} .verdict li{margin:3px 0}

.goal{padding:10px 0;border-bottom:1px solid var(--line)} .goal:last-child{border-bottom:0}
.goal .top2{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px;gap:8px}
.goal .top2 b{font-weight:600} .goal .top2 span{font-weight:700;white-space:nowrap}
.goal .bar{height:9px;overflow:visible}
.goal .pace{position:absolute;top:-3px;width:2px;height:15px;background:var(--ink);opacity:.35;border-radius:2px}

.up{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .up:last-child{border-bottom:0}
.up .when{width:52px;text-align:center;flex:none;border-radius:14px;background:var(--soft);padding:6px 0;line-height:1.1}
.up .when b{display:block;font-size:18px;font-weight:900} .up .when small{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700}
.up .nm{flex:1;min-width:0} .up .nm b{display:block;font-size:14px;font-weight:600} .up .nm small{font-size:12px;color:var(--muted)}
.up .v{font-weight:800;white-space:nowrap}
.soon{color:var(--danger)!important;font-weight:700}

.strip{display:flex;align-items:flex-end;gap:3px;height:110px;position:relative;padding-top:6px}
.strip .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--save);opacity:.7}
.strip .lim span{position:absolute;right:0;top:-18px;font-size:10px;font-weight:700;color:var(--save)}
.strip .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;border:0;background:none;padding:0}
.strip .c i{display:block;border-radius:5px 5px 2px 2px;transform-origin:bottom;animation:grow .8s var(--ease) both;animation-delay:calc(var(--i) * 25ms)}
.strip .c.fut i{background:var(--soft)!important;height:6px!important}
.strip .c.today i{outline:2px solid var(--ink);outline-offset:1px}
.strip-days{display:flex;gap:3px;margin-top:6px}
.strip-days span{flex:1;text-align:center;font-size:9px;color:var(--muted)}
.legend-s{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend-s span{display:inline-flex;align-items:center;gap:6px}
.legend-s i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tipday{font-size:13px;margin-top:10px;min-height:20px;font-weight:600}

.day{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between}
.day:first-child{margin-top:0}
.it{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--soft)}
.it .nm{flex:1;min-width:0}
.it .nm b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .nm small{font-size:12px;color:var(--muted)}
.it .am{font-weight:800;font-size:15px;white-space:nowrap}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
.pill.fun{background:#fce7f3;color:#be185d} .pill.fix{background:#e0e7ff;color:#4338ca} .pill.int{background:var(--soft);color:var(--muted)} .pill.rev{background:#d1fae5;color:#047857}
.more{width:100%;border:0;background:var(--soft);color:var(--ink);font-weight:600;padding:12px;border-radius:14px;cursor:pointer;margin-top:8px}

.donut-wrap{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:center}
@media (max-width:560px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}
.donut circle{transition:stroke-dasharray 1.3s var(--ease)}
.legend .l{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.legend .l:last-child{border-bottom:0}
.legend .d{width:12px;height:12px;border-radius:4px;flex:none}
.legend .l span:nth-child(2){flex:1}
.rule{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rule div{border-radius:20px;padding:14px 12px;color:#fff;position:relative;overflow:hidden}
.rule div::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25),transparent 70%);animation:shimmer 3.5s ease-in-out infinite;animation-delay:calc(var(--i) * .6s)}
.rule .v{font-size:22px;font-weight:900;letter-spacing:-.02em;white-space:nowrap;margin:2px 0}
.rule .t{font-size:12px;opacity:.92;font-weight:500}
@media (max-width:420px){.rule .v{font-size:18px}}
.rows .r{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rows .r:last-child{border-bottom:0}
.rows .r .nm{flex:1;min-width:0}
.rows .r .nm b{display:block;font-size:14px;font-weight:600}
.rows .r .nm small{font-size:12px;color:var(--muted)}
.rows .r .bar{height:6px;margin-top:6px}
.rows .r .v{font-weight:800;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:12px;border-top:2px solid var(--line);font-weight:700}
.total .v{font-size:22px;font-weight:900}

.streak{display:flex;align-items:center;gap:16px}
.streak .flame{font-size:54px;animation:pop .6s var(--ease) both;filter:drop-shadow(0 6px 14px rgba(245,158,11,.45))}
.streak .n{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.badge{background:var(--soft);border-radius:18px;padding:14px 8px;text-align:center}
.badge .e{font-size:30px;display:block;filter:grayscale(1);opacity:.35}
.badge b{display:block;font-size:12px;margin-top:6px} .badge small{font-size:11px;color:var(--muted)}
.badge.on{background:linear-gradient(160deg,rgba(245,158,11,.18),rgba(236,72,153,.12))}
.badge.on .e{filter:none;opacity:1;animation:pop .6s var(--ease) both;animation-delay:calc(var(--i)*90ms)}
.counters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.counter{background:var(--soft);border-radius:18px;padding:14px}
.counter .e{font-size:22px} .counter .n{font-size:30px;font-weight:900;letter-spacing:-.03em;margin-top:4px}
.counter .n small{font-size:15px;color:var(--muted);font-weight:700}
.counter .t{font-size:12px;color:var(--muted)}
.counter .dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.counter .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.counter .dots i.f{background:var(--save)} .counter .dots i.x{background:var(--danger)}
.curve path.plan{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease) .2s forwards}
.rev{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)} .rev:last-child{border-bottom:0}
.rev .nm{flex:1;min-width:0} .rev .nm b{display:block;font-size:14px;font-weight:600} .rev .nm small{font-size:12px;color:var(--muted)}
.rev .v{font-weight:800;color:var(--save);white-space:nowrap}

.todo{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.todo:last-child{border-bottom:0}
.todo .ck{width:28px;height:28px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;font-size:15px;margin-top:2px;transition:all .3s var(--ease)}
.todo.done .ck{background:var(--save);border-color:var(--save);color:#fff;animation:pop .4s var(--ease)}
.todo b{display:block;font-size:15px}
.todo.done b{color:var(--muted);text-decoration:line-through}
.todo p{margin:3px 0 0;color:var(--muted);font-size:13px}
.gain{display:inline-block;font-weight:700;color:var(--save);font-size:12px;margin-top:7px;background:rgba(16,185,129,.12);padding:3px 9px;border-radius:99px}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:99px;transition:width .8s var(--ease)}

/* ---------- import / vide ---------- */
.empty{text-align:center;padding:10px 4px}
.empty .e{font-size:52px;animation:pop .7s var(--ease) both}
.empty h2{font-size:20px;margin:8px 0 6px;letter-spacing:-.02em}
.steps{text-align:left;margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14px}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:9px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.bigbtn{width:100%;border:0;border-radius:18px;padding:16px;font-weight:800;font-size:16px;color:#fff;background:linear-gradient(120deg,#4f46e5,#7c3aed);cursor:pointer;margin-top:12px;transition:transform .2s var(--ease)}
.bigbtn:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:16px;font-weight:600;font-size:14px;opacity:0;transition:all .4s var(--ease);z-index:60;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- feuille de catégorie ---------- */
.backdrop{position:fixed;inset:0;background:rgba(9,11,18,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.sheetbox{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px max(16px, env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));animation:sheet .4s var(--ease) both;max-height:85vh;overflow:auto}
.sheetbox h3{margin:4px 0 2px;font-size:18px}
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.catgrid button{border:2px solid transparent;background:var(--soft);border-radius:16px;padding:10px 4px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.catgrid button .e{font-size:22px}
.catgrid button.on{border-color:var(--fix);background:var(--card)}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px}

/* ---------- réglages ---------- */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.field:last-child{border-bottom:0}
.field input{width:110px;text-align:right;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 10px}
.field input.wide{width:100%;text-align:left}
.fixrow{display:grid;grid-template-columns:1fr 84px 54px 30px;gap:6px;align-items:center;padding:6px 0}
.fixrow input{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px;font-size:13px}
.fixrow .kw{grid-column:1/4;font-size:12px}
.fixrow + .fixrow{border-top:1px solid var(--line);padding-top:10px}
.del{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.ghost{border:1px dashed var(--line);background:none;color:var(--ink);border-radius:14px;padding:10px;width:100%;font-weight:600;cursor:pointer;margin-top:8px}
.danger{color:var(--danger)}

/* ---------- nav ---------- */

<script>
"use strict";
/* =====================================================================
   Mon Budget — web app installable.
   Toutes les données (relevés importés, réglages) restent dans le
   navigateur du téléphone (localStorage). Rien n'est envoyé nulle part.
   ===================================================================== */

/* ---------- catégories ---------- */
const CATS = {
  courses:{n:'Courses',e:'🛒',bg:'#dcfce7'}, essence:{n:'Essence',e:'⛽',bg:'#fef3c7'},
  fastfood:{n:'Fast-food',e:'🍔',bg:'#ffe4e6'}, resto:{n:'Restos & snacks',e:'🍽️',bg:'#ffe4e6'},
  parking:{n:'Parking & transports',e:'🅿️',bg:'#e0f2fe'}, peage:{n:'Péages',e:'🛣️',bg:'#ffedd5'},
  maison:{n:'Maison',e:'🔨',bg:'#ecfccb'}, sante:{n:'Santé',e:'💊',bg:'#d1fae5'},
  envoi:{n:'Argent envoyé',e:'💸',bg:'#e2e8f0'}, autre:{n:'Divers',e:'❓',bg:'#f1f5f9'},
  plaisir:{n:'Plaisir',e:'🎁',bg:'#fce7f3'}, fixe:{n:'Charge fixe',e:'🔒',bg:'#e0e7ff'},
  epargne:{n:'Épargne',e:'🏦',bg:'#d1fae5'}, revenu:{n:'Rentrée',e:'💰',bg:'#d1fae5'},
  interne:{n:'Entre mes comptes',e:'🔁',bg:'#f1f5f9'},
};
const VIE_CATS = ['courses','essence','fastfood','resto','parking','peage','maison','sante','envoi','autre'];
const RULES = [
  ['plaisir',/amazon(?!.*prime)|kiabi|zara|h&m|playstation|steam|nintendo|xbox|fnac|darty|electro d[ée]p[ôo]t|grande r[ée]cr[ée]|animshop|shein|primark|decathlon|nike|adidas|elevenlabs|aliexpress|temu|micromania|sephora|jd sports|courir|apple store/i],
  ['fastfood',/mcdonald|burger king|autogrill|kfc|\bquick\b|five guys|o'?tacos|subway|domino|pizza hut|uber ?eats|deliveroo|just ?eat/i],
  ['courses',/intermarch|carrefour|leclerc|auchan|magasin u|super u|hyper u|march[ée] u|lidl|aldi|migros(?!.*(restaurant))|\bcoop\b|denner|monoprix|franprix|casino|picard|grand frais|netto|spar|biocoop/i],
  ['essence',/totalenergies|\btotal\b|\beni\b|migrol|\besso\b|\bshell\b|\bbp\b|\bavia\b|\bagip\b|tamoil|socar|carburant|station[- ]service/i],
  ['peage',/sanef|aprr|\barea\b|vinci autoroute|autoroute|atmb|escota|cofiroute|p[ée]age|bip&go|ulys/i],
  ['parking',/parking|transports publics|\btpg\b|\bsbb\b|\bcff\b|sncf|indigo|onepark|ratp|navigo|uber(?! ?eats)|bolt/i],
  ['maison',/leroy merlin|b&m|castorama|ikea|\baction\b|bricorama|gifi|maisons du monde|brico|but\b|conforama/i],
  ['sante',/pharmac|pharmagal|m[ée]decin|docteur|dentiste|optic|laborat|h[ôo]pital|clinique/i],
  ['resto',/restaurant|resto|l[ée]on\b|rif land|p[âa]tisserie|boulangerie|caf[ée]|starbucks|\bpaul\b|brioche|euro masa|bar\b|brasserie|kebab|sushi|pizza/i],
];

/* ---------- réglages par défaut (génériques : les tiens arrivent par ton lien privé) ---------- */
const DEFAULTS = {
  salaryChf:0, rate:1.08, payDay:24, savingsGoal:1000, plaisir:150, savingsBalance:0,
  ownNames:'', fixed:[], goals:{courses:600,essence:200,fastfood:0,resto:50,parking:80,peage:50,maison:60,sante:50,envoi:100,autre:50,plaisir:150},
};

/* ---------- stockage ---------- */
const store={get(k,d){try{const v=localStorage.getItem('mb2.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('mb2.'+k,JSON.stringify(v))}catch(e){toast('Stockage plein ou bloqué : les données ne sont pas enregistrées')}}};
let S = Object.assign({}, DEFAULTS, store.get('settings',{}));
S.goals = Object.assign({}, DEFAULTS.goals, S.goals||{});
let TXS = store.get('tx',[]);          // toutes les opérations importées
let OVR = store.get('overrides',{});   // catégorie choisie à la main, par commerçant
let saved = store.get('saved',{});
let done = store.get('todos',{});
let lastImport = store.get('lastImport',null);

/* ---------- lien de configuration privé : #setup=... ---------- */
// #setup=<json en base64>  ou  #setupz=<json compressé (deflate) : réglages + opérations>
function b64bytes(x){ const bin=atob(x.replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(bin,c=>c.charCodeAt(0)); }
function installCfg(cfg, txOnly){
  const set = cfg.s || cfg;
  if(!txOnly){ S = Object.assign({}, DEFAULTS, set); S.goals = Object.assign({}, DEFAULTS.goals, set.goals||{}); store.set('settings',S); }
  let added=0;
  if(Array.isArray(cfg.t)){
    const ids=new Set(TXS.map(t=>t.id));
    cfg.t.forEach(([id,d,desc,amt,cur,type,product])=>{ if(!ids.has(id)){ TXS.push({id,d,desc,amt,cur,type,product}); added++; } });
    TXS.sort((a,b)=>a.d.localeCompare(b.d)); store.set('tx',TXS);
  }
  return {added};
}
async function applySetup(text){
  text=String(text||'');
  try{
    let m=text.match(/#setupz=([A-Za-z0-9_\-]+)/);
    if(m){
      const stream=new Blob([b64bytes(m[1])]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return installCfg(JSON.parse(await new Response(stream).text()));
    }
    m=text.match(/#setup=([A-Za-z0-9_\-]+)/);
    if(m) return installCfg(JSON.parse(new TextDecoder().decode(b64bytes(m[1]))));
  }catch(e){}
  return null;
}
/* ---------- données chiffrées (data.enc.json) : déverrouillées avec ton code ---------- */
let ENC=null;
const cleanCode = c => String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function decryptData(code){
  const b=x=>b64bytes(x);
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(cleanCode(code)), 'PBKDF2', false, ['deriveKey']);
  const aes = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(ENC.salt), iterations:ENC.it, hash:'SHA-256'}, key, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(ENC.iv)}, aes, b(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function unlock(code, quiet){
  try{
    const cfg = await decryptData(code);
    const first = !store.get('code',null);
    const r = installCfg(cfg, !first);
    store.set('code', cleanCode(code)); store.set('dataV', ENC.v);
    if(!quiet) toast(`Tes chiffres sont là ✅`);
    else if(r.added) toast(`${r.added} nouvelle${r.added>1?'s':''} opération${r.added>1?'s':''} ajoutée${r.added>1?'s':''} ✅`);
    render(); return true;
  }catch(e){ if(!quiet) toast('Code incorrect'); return false; }
}
(async function(){
  try{
    const res = await fetch('data.enc.json',{cache:'no-store'}); if(!res.ok) return;
    ENC = await res.json();
    const code = store.get('code',null);
    if(code && ENC.v > store.get('dataV',0)) await unlock(code, true);
    else if(!code) render();
  }catch(e){}
})();

function codeCard(){ return `<div class="card hero"><div class="blob b1"></div><div class="blob b2"></div><div style="position:relative">
    <div class="lbl">Bienvenue 👋</div><div class="big" style="font-size:40px">🔒 Ton code</div>
    <div class="sub" style="max-width:none">Tape ton code ici (une seule fois) pour afficher tous tes chiffres.</div>
    <input id="codeIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-label="Ton code"
      style="width:100%;margin-top:16px;border:0;border-radius:16px;padding:16px;font:inherit;font-size:22px;font-weight:800;letter-spacing:.12em;text-align:center;color:#111;background:#fff">
    <button class="bigbtn" style="background:#111827" id="codeGo">Afficher mes chiffres</button></div></div>`; }
function bindCodeCard(){
  const go=async()=>{ $('codeGo').textContent='…'; if(!(await unlock($('codeIn').value))) $('codeGo').textContent='Afficher mes chiffres'; };
  $('codeGo').onclick=go; $('codeIn').onkeydown=e=>{ if(e.key==='Enter') go(); };
}
function setupToast(r){ return r ? (r.added?`Réglages + ${r.added} opérations installés ✅`:'Tes réglages sont installés ✅') : 'Lien non reconnu : copie-le en entier'; }
(async function(){
  if(!/^#setupz?=/.test(location.hash)) return;
  const r = await applySetup(location.hash);
  history.replaceState(null,'',location.pathname+location.search);
  toast(setupToast(r)); if(r) render();
})();

/* ---------- outils ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n,d=0)=>(n<0?'−':'')+Math.abs(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})+' €';
const D = s => new Date(s+'T12:00');
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dFr = s => D(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const dLong = s => D(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const daysBetween = (a,b)=>Math.round((D(b)-D(a))/864e5);
const sum = a => a.reduce((s,x)=>s+x.v,0);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el,to,{d=0,dur=1000,suffix=''}={}){
  if(!el) return;
  if(reduce){el.textContent=fmt(to,d)+suffix;return;}
  const t0=performance.now();
  const step=t=>{const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,4); el.textContent=fmt(to*e,d)+suffix; if(p<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
let toastT; function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3200);}
function burst(x,y){
  if(reduce) return;
  const cols=['#10b981','#f59e0b','#ec4899','#6366f1','#38bdf8'];
  for(let i=0;i<34;i++){const c=document.createElement('i');c.className='conf';
    const a=Math.random()*Math.PI*2, r=80+Math.random()*120;
    c.style.cssText=`left:${x}px;top:${y}px;background:${cols[i%5]};--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r-60}px;--r:${Math.random()*720}deg`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),1100);}
}

/* =====================================================================
   IMPORT DU RELEVÉ REVOLUT (CSV ou Excel)
   ===================================================================== */
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0]||'';
  const delim = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function loadXLSX(){
  return new Promise((ok,ko)=>{
    if(window.XLSX) return ok(window.XLSX);
    const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=()=>ok(window.XLSX); s.onerror=()=>ko(new Error('Lecture Excel indisponible hors connexion : exporte plutôt en CSV.'));
    document.head.appendChild(s);
  });
}
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function findCol(head, words){ return head.findIndex(h=>words.some(w=>norm(h).includes(w))); }
function parseNum(s){
  s=String(s||'').replace(/\s| /g,'').replace(/[€$]|CHF|EUR/gi,'');
  if(s.includes(',')&&s.includes('.')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else s=s.replace(',','.');
  const n=parseFloat(s); return isNaN(n)?null:n;
}
function parseDate(s){
  s=String(s||'').trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  const d=new Date(s); return isNaN(d)?null:iso(d);
}
function rowsToTx(rows){
  const hi = rows.findIndex(r=>r.some(c=>/description|libell/i.test(c)) && r.some(c=>/montant|amount/i.test(c)));
  if(hi<0) throw new Error("Je ne reconnais pas ce fichier. Exporte le relevé Revolut au format CSV ou Excel.");
  const head = rows[hi];
  const ci = {
    type:findCol(head,['type']), product:findCol(head,['product','produit']),
    date:findCol(head,['started','date de debut','debut','date']), done:findCol(head,['completed','date de fin','fin']),
    desc:findCol(head,['description','libelle']), amount:findCol(head,['amount','montant']),
    fee:findCol(head,['fee','frais']), cur:findCol(head,['currency','devise']), state:findCol(head,['state','etat','statut']),
  };
  const out=[]; const seen={};
  rows.slice(hi+1).forEach(r=>{
    const state = norm(r[ci.state]);
    if(state && /revert|declin|fail|annul|rejet|refuse/.test(state)) return;
    const date = parseDate(r[ci.date]) || (ci.done>=0 ? parseDate(r[ci.done]) : null);
    const amt = parseNum(r[ci.amount]); if(!date || amt===null) return;
    const fee = ci.fee>=0 ? (parseNum(r[ci.fee])||0) : 0;
    const cur = (ci.cur>=0 ? String(r[ci.cur]).trim().toUpperCase() : 'EUR') || 'EUR';
    const desc = String(r[ci.desc]||'').trim();
    const type = norm(r[ci.type]); const product = norm(r[ci.product]);
    const base = `${date}|${desc}|${amt}|${cur}|${product}`; seen[base]=(seen[base]||0)+1;
    out.push({id:base+'|'+seen[base], d:date, desc, amt:amt-Math.abs(fee)*(amt<0?1:0), cur, type, product});
  });
  return out;
}
async function importFiles(files){
  let added=0, dup=0, total=0;
  try{
    for(const f of files){
      let rows;
      if(/\.xlsx?$/i.test(f.name)){
        const X = await loadXLSX(); const wb = X.read(await f.arrayBuffer(),{type:'array'});
        rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''});
      } else rows = parseCSV(await f.text());
      const txs = rowsToTx(rows); total+=txs.length;
      const ids = new Set(TXS.map(t=>t.id));
      txs.forEach(t=>{ if(ids.has(t.id)) dup++; else { TXS.push(t); added++; } });
    }
    TXS.sort((a,b)=>a.d.localeCompare(b.d));
    store.set('tx',TXS); lastImport = new Date().toISOString(); store.set('lastImport',lastImport);
    toast(total ? `${added} opération${added>1?'s':''} ajoutée${added>1?'s':''}${dup?` · ${dup} déjà présente${dup>1?'s':''}`:''} ✅` : 'Aucune opération trouvée dans ce fichier');
    render();
  }catch(e){ toast(e.message||'Import impossible'); }
}

/* =====================================================================
   CLASSEMENT
   ===================================================================== */
const ownRe = () => { const n=S.ownNames.split(',').map(x=>x.trim()).filter(Boolean); return n.length? new RegExp(n.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'i') : null; };
const merchantKey = t => norm(t.desc).replace(/\d{3,}/g,'').replace(/\s+/g,' ').trim();
function classify(t){
  const desc=t.desc, own=ownRe();
  // charges fixes déclarées dans les réglages (mot-clé + montant proche si « strict »)
  for(const f of S.fixed){
    if(!f.kw) continue;
    if(desc.toLowerCase().includes(f.kw.toLowerCase()) && (!f.strict || Math.abs(Math.abs(t.amt)*(t.cur==='CHF'?S.rate:1) - f.v) < 1.5)) return t.amt<0?'fixe':'revenu';
  }
  const k = merchantKey(t);
  if(OVR[k]) return OVR[k];
  if(/exchange|change|conversion/.test(t.type) || /^change en|^exchanged? to|^convert/i.test(desc)) return 'interne';
  if(/savings|epargne|coffre|vault|pocket/.test(t.product)) return t.amt>0?'epargne':'interne';
  if(/^(to|vers|depuis|from) (eur|chf|usd|gbp)\b|épargne|savings|coffre|vault|pocket/i.test(desc)) return t.amt<0?'epargne':'interne';
  if(own && own.test(desc) && /transfer|virement|topup|recharge|paiement envoy|^to |^from |virement/i.test(t.type+' '+desc)) return 'interne';
  if(/recharge sur apple pay|top-?up|recharge/i.test(t.type+' '+desc) && t.amt>0) return 'interne';
  if(t.amt>0) return 'revenu';
  for(const [c,re] of RULES) if(re.test(desc)) return c;
  if(/transfer|virement|^to |^virement/i.test(t.type+' '+desc)) return 'envoi';
  return 'autre';
}
function enrich(){
  return TXS.map(t=>{ const v=Math.abs(t.amt)*(t.cur==='CHF'?S.rate:t.cur==='EUR'?1:1); return Object.assign({},t,{c:classify(t),v,sign:t.amt<0?-1:1}); });
}
function fixedLabel(t){ for(const f of S.fixed){ if(f.kw && t.desc.toLowerCase().includes(f.kw.toLowerCase()) && (!f.strict||Math.abs(t.v-f.v)<1.5)) return f.n; } return null; }

/* =====================================================================
   CALCULS DU MOIS DE PAIE
   ===================================================================== */
function cycleFor(dateIso){
  const d=D(dateIso), p=S.payDay;
  let s=new Date(d.getFullYear(), d.getMonth(), p, 12); if(d.getDate()<p) s=new Date(d.getFullYear(), d.getMonth()-1, p, 12);
  const e=new Date(s.getFullYear(), s.getMonth()+1, p-1, 12);
  return {start:iso(s), end:iso(e)};
}
function compute(){
  const all = enrich();
  const today = iso(new Date());
  const C = cycleFor(today);
  const inC = all.filter(t=>t.d>=C.start && t.d<=C.end);
  const vie = inC.filter(t=>t.sign<0 && VIE_CATS.includes(t.c));
  const fun = inC.filter(t=>t.sign<0 && t.c==='plaisir');
  const fix = inC.filter(t=>t.sign<0 && t.c==='fixe');
  const rev = inC.filter(t=>t.sign>0 && t.c==='revenu');
  const epa = inC.filter(t=>t.c==='epargne');
  const salaryEur = S.salaryChf*S.rate;
  const fixTotal = S.fixed.reduce((a,f)=>a+(+f.v||0),0);
  const vieGoal = VIE_CATS.reduce((a,k)=>a+(+S.goals[k]||0),0);
  const perDayGoal = vieGoal/30.4;
  const totalDays = daysBetween(C.start,C.end)+1;
  const daysLeft = daysBetween(today,C.end)+1;
  const daysElapsed = totalDays-daysLeft+1;
  const BUDGET = perDayGoal*totalDays;
  const vieSpent=sum(vie), funSpent=sum(fun), vieToday=sum(vie.filter(t=>t.d===today));
  const leftVie = BUDGET-vieSpent;
  const perDayBase=(leftVie+vieToday)/daysLeft, perDayNow=perDayBase-vieToday;
  const pace = vieSpent/daysElapsed;
  const projVie = vieSpent + pace*(daysLeft-1);
  const projSave = salaryEur - fixTotal - projVie - funSpent;
  const lastTx = all.length ? all[all.length-1].d : null;
  return {all,today,C,inC,vie,fun,fix,rev,epa,salaryEur,fixTotal,vieGoal,perDayGoal,totalDays,daysLeft,daysElapsed,BUDGET,vieSpent,funSpent,vieToday,leftVie,perDayBase,perDayNow,pace,projVie,projSave,lastTx};
}

    await typeIn(msg,`${A.name.replace(/ ★+/,'')} a évolué en ${B.name} !`);

function nextDate(day,every,last,today){
  if(last){ let d=D(last); while(iso(d)<=today) d.setMonth(d.getMonth()+every); return iso(d); }
  const t=D(today); const mk=(y,m)=>{const dim=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(day,dim),12);};
  let d=mk(t.getFullYear(),t.getMonth()); if(iso(d)<=today) d=mk(t.getFullYear(),t.getMonth()+1);
  return iso(d);
}

  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  $('ind').style.transform=`translateX(${ORDER.indexOf(s)*100}%)`;
  document.querySelectorAll('section').forEach(x=>x.classList.toggle('on',x.id==='s-'+s));
  $('title').textContent=TITLES[s];
  render(true);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.s));
$('file').onchange=e=>{ if(e.target.files.length) importFiles([...e.target.files]); e.target.value=''; };
let theme=store.get('theme',null); if(theme) document.documentElement.dataset.theme=theme;
$('themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;theme=dark?'light':'dark';document.documentElement.dataset.theme=theme;store.set('theme',theme);};
show(tab);

/* hors connexion */
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  // une nouvelle version vient de s'installer : on recharge une fois pour l'afficher
  let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!reloaded){ reloaded=true; location.reload(); } });
}
</script>
</body>
</html>
