name: Déployer le site sur GitHub Pages

on:
  push:
    branches:
      - claude/pokemon-like-game-j2cjmy
  workflow_dispatch:

# Permissions nécessaires au déploiement Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Pages (activation automatique)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetage du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déploiement
        id: deployment
        uses: actions/deploy-pages@v4
