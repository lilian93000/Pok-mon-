name: Déploiement automatique sur IONOS (SFTP)

on:
  push:
    branches:
      - claude/token-usage-check-vcinzx
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysetacopro
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: analysetacopro/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Retrait de l'API (non supportée en site statique)
        run: rm -rf app/api

      - name: Build (export statique, racine du domaine)
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC: "true"
          BASE_PATH: ""
        run: npm run build

      - name: Page 404 + config
        run: printf 'ErrorDocument 404 /404.html\nOptions -Indexes\n' > out/.htaccess

      - name: Envoi vers IONOS par SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.IONOS_SFTP_SERVER }}
          username: ${{ secrets.IONOS_SFTP_USERNAME }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: 22
          local_path: "./analysetacopro/out/*"
          remote_path: "/public/ionos/analysetacopro-ionos"
          sftp_only: true
