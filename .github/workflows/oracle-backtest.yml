name: Oracle Bourse — backtest

on:
  workflow_dispatch: {}
  schedule:
    # Chaque dimanche 06h00 UTC (lourd, donc pas quotidien)
    - cron: "0 6 * * 0"

permissions:
  contents: write

concurrency:
  group: oracle-bourse-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backtest du modèle (signaux de prix)
        run: node bourse/auto/backtest.js

      - name: Validation hors-échantillon (anti-triche)
        run: node bourse/auto/validate.js

      - name: Commit du résultat
        run: |
          git config user.name "oracle-bourse[bot]"
          git config user.email "oracle-bourse[bot]@users.noreply.github.com"
          git add bourse/data/backtest.json bourse/data/validate.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "🔬 Backtest du $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
