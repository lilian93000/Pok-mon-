name: Déployer AnalyseTaCopro sur GitHub Pages

on:
  push:
    branches:
      - claude/token-usage-check-vcinzx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-ghpages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysetacopro
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: analysetacopro/package-lock.json

      - name: Calcul du chemin de base
        id: base
        run: echo "path=/$(echo '${{ github.repository }}' | cut -d/ -f2)" >> "$GITHUB_OUTPUT"

      - name: Installation des dépendances
        run: npm ci

      - name: Retrait de l'API (non supportée en site statique)
        run: rm -rf app/api

      - name: Build (export statique)
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_STATIC: "true"
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Désactiver Jekyll
        run: touch out/.nojekyll

      - name: Publication sur la branche gh-pages
        working-directory: analysetacopro/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: site statique AnalyseTaCopro (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
