name: Oracle Bourse — analyse quotidienne

on:
  schedule:
    # 21h35 UTC du lundi au vendredi ≈ 35 min après la clôture de Wall Street
    # NB : les crons GitHub ne tournent que sur la branche par défaut du repo.
    - cron: "35 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: oracle-bourse
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Analyse multi-facteurs (screener marché entier)
        env:
          # Secret optionnel (Settings → Secrets → Actions) : active le pilier fondamental
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node bourse/auto/run.js

      - name: Suivi de performance des picks passés (vs S&P 500)
        run: node bourse/auto/track.js || echo "suivi indisponible (non bloquant)"

      - name: Commit des résultats
        run: |
          git config user.name "oracle-bourse[bot]"
          git config user.email "oracle-bourse[bot]@users.noreply.github.com"
          git add bourse/data/
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "🤖 Analyse quotidienne du $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
