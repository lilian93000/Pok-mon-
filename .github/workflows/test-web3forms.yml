name: Test Web3Forms (temporaire)
on:
  push:
    branches: [claude/eager-johnson-h5khu9]
    paths: [.github/workflows/test-web3forms.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Réponse brute vue par un navigateur
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          echo "--- préflight (OPTIONS)"
          curl -sS -i -X OPTIONS https://api.web3forms.com/submit -H "Origin: https://analysetacopro.fr" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: accept" -A "$UA" | head -20
          echo "--- POST comme le site"
          curl -sS -i https://api.web3forms.com/submit -H "Origin: https://analysetacopro.fr" -H "Referer: https://analysetacopro.fr/contact/" -H "Accept: application/json" -A "$UA" \
            -F access_key=00c0ecce-d9cb-402d-b589-1d5c155aae05 -F "subject=TEST D — à ignorer" -F "Message=Test D" | grep -viE "^(set-cookie|cf-ray|nel|report-to)"
