<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Dawn sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#2b2150"/>
      <stop offset="22%" stop-color="#6a4a7a"/>
      <stop offset="45%" stop-color="#c9728f"/>
      <stop offset="66%" stop-color="#f0a07a"/>
      <stop offset="85%" stop-color="#ffd28a"/>
      <stop offset="100%" stop-color="#ffe9b0"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff4d6" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffdf9e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffdf9e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lyricVeil" cx="50%" cy="50%" r="62%">
      <stop offset="0%"   stop-color="#1c0f30" stop-opacity="0.45"/>
      <stop offset="70%"  stop-color="#1c0f30" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1c0f30" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="100%" stop-color="#ffd277"/>
    </linearGradient>

    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4f6e"/>
      <stop offset="100%" stop-color="#5e3a5c"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f2a4f"/>
      <stop offset="100%" stop-color="#2c1d3d"/>
    </linearGradient>

    <!-- Soft top + bottom shading for text legibility -->
    <linearGradient id="topShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1336" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1a1336" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="botShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241338" stop-opacity="0"/>
      <stop offset="100%" stop-color="#241338" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1a0f2e" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1080" height="1920" fill="url(#sky)"/>

  <!-- Stars (top of frame, fading dawn) -->
  <g fill="#fff8e6">
    <circle cx="120" cy="160" r="2.5" opacity="0.9"/>
    <circle cx="300" cy="90"  r="1.8" opacity="0.7"/>
    <circle cx="520" cy="200" r="2.2" opacity="0.6"/>
    <circle cx="760" cy="120" r="1.6" opacity="0.8"/>
    <circle cx="940" cy="220" r="2.4" opacity="0.7"/>
    <circle cx="200" cy="320" r="1.5" opacity="0.5"/>
    <circle cx="870" cy="350" r="1.8" opacity="0.5"/>
    <circle cx="640" cy="60"  r="1.4" opacity="0.6"/>
  </g>

  <!-- Sun glow + sun rising over hills -->
  <circle cx="540" cy="1430" r="540" fill="url(#sunGlow)"/>
  <circle cx="540" cy="1430" r="190" fill="url(#sun)"/>

  <!-- Birds -->
  <g stroke="#3a2540" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65">
    <path d="M250 470 q22 -22 44 0 q22 -22 44 0"/>
    <path d="M740 540 q18 -18 36 0 q18 -18 36 0"/>
    <path d="M560 430 q14 -14 28 0 q14 -14 28 0"/>
  </g>

  <!-- Distant hill -->
  <path d="M0 1320 Q270 1200 540 1280 Q810 1360 1080 1250 L1080 1920 L0 1920 Z" fill="url(#hill1)" opacity="0.85"/>
  <!-- Foreground hill -->
  <path d="M0 1480 Q300 1380 600 1470 Q840 1545 1080 1450 L1080 1920 L0 1920 Z" fill="url(#hill2)"/>

  <!-- A lone tree silhouette -->
  <g fill="#1f1430">
    <rect x="832" y="1430" width="16" height="120"/>
    <circle cx="840" cy="1410" r="58"/>
    <circle cx="800" cy="1430" r="40"/>
    <circle cx="880" cy="1430" r="40"/>
  </g>

  <!-- Shading overlays -->
  <rect width="1080" height="620" fill="url(#topShade)"/>
  <rect y="1300" width="1080" height="620" fill="url(#botShade)"/>

  <!-- Soft veil behind lyrics for legibility -->
  <ellipse cx="540" cy="1000" rx="620" ry="430" fill="url(#lyricVeil)"/>

  <!-- ===== Lyrics ===== -->
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" filter="url(#textShadow)">
    <text x="540" y="720" font-size="92" fill="#fff7ec" font-style="italic" font-weight="700">Stay a little while,</text>
    <text x="540" y="830" font-size="92" fill="#fff7ec" font-style="italic" font-weight="700">my dear</text>

    <text x="540" y="980"  font-size="70" fill="#ffeede" font-style="italic">Time melts when</text>
    <text x="540" y="1062" font-size="70" fill="#ffeede" font-style="italic">you're near</text>

    <text x="540" y="1210" font-size="64" fill="#fff2dd" font-style="italic">Let the morning</text>
    <text x="540" y="1286" font-size="64" fill="#fff2dd" font-style="italic">take its time</text>
  </g>

  <!-- Small handle / footer -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="540" y="1800" font-size="34" fill="#fff" opacity="0.85" letter-spacing="3">&#9834; morning love</text>
  </g>
</svg>
