<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Accroche signature AnalyseTaCopro (2,1 s) — la même devant chaque vidéo TikTok.
         4 coupes franches sur le temps (phonk 128 BPM, le drop tombe dès l'image 0) :
         « CE QUE » (jaune) → « TON FUTUR APPART » (noir) → « TE CACHE » (rouge) → la colonne + « On l'a trouvé. » (bleu)
         Composé en 1080×1920, rendu en 2160×3840 à 60 i/s. Son : tools/soundtrack.py */
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ffe14d;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        background: #ffe14d;
      }
      .clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .abs {
        position: absolute;
      }
      .ph {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #p1 {
        background: #ffe14d;
      }
      #p2 {
        background: #09090d;
      }
      #p3 {
        background: #ff2340;
      }
      #p4 {
        background: radial-gradient(70% 50% at 50% 46%, #3d86ff 0%, #0b5fff 45%, #0636a8 100%);
      }
      .txt {
        position: relative;
        width: 940px;
        margin-left: -70px;
        text-align: center;
        font-weight: 900;
        letter-spacing: -0.065em;
        line-height: 0.86;
      }
      #p1 .txt {
        font-size: 340px;
        color: #09090d;
      }
      #p2 .txt {
        font-size: 236px;
        color: #fff;
      }
      #p2 .txt .y {
        color: #ffe14d;
      }
      #p3 .txt {
        font-size: 250px;
        color: #fff;
      }
      .ghost {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
      }
      #g1 {
        color: #00f0ff;
      }
      #g2 {
        color: #ffd400;
      }
      .lines {
        position: absolute;
        left: -420px;
        top: -420px;
        width: 1920px;
        height: 2760px;
        opacity: 0.22;
      }
      #col {
        position: absolute;
        left: 345px;
        top: 470px;
        width: 320px;
        height: 470px;
      }
      #col svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        filter: drop-shadow(0 0 50px rgba(255, 255, 255, 0.55));
      }
      .ring {
        position: absolute;
        left: 505px;
        top: 900px;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        border: 5px solid rgba(255, 255, 255, 0.8);
        opacity: 0;
      }
      #found {
        left: 0;
        width: 1010px;
        top: 1000px;
        text-align: center;
        font-size: 150px;
        font-weight: 900;
        letter-spacing: -0.06em;
        color: #fff;
        line-height: 0.95;
      }
      #brand {
        left: 0;
        width: 1010px;
        top: 1180px;
        text-align: center;
        font-size: 52px;
        font-weight: 800;
        letter-spacing: 0.02em;
        color: #cfe0ff;
      }
      #flash {
        background: #fff;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.11"
      data-width="1080"
      data-height="1920"
    >
      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="2.11" data-track-index="4" data-volume="1"></audio>

      <section id="p1" class="clip ph" data-start="0" data-duration="0.469" data-track-index="0">
        <svg class="lines" id="l1" viewBox="0 0 1920 2760"></svg>
        <div class="txt">CE<br />QUE</div>
      </section>
      <section id="p2" class="clip ph" data-start="0.469" data-duration="0.469" data-track-index="0">
        <svg class="lines" id="l2" viewBox="0 0 1920 2760"></svg>
        <div class="txt">TON<br />FUTUR<br /><span class="y">APPART</span></div>
      </section>
      <section id="p3" class="clip ph" data-start="0.938" data-duration="0.469" data-track-index="0">
        <svg class="lines" id="l3" viewBox="0 0 1920 2760"></svg>
        <div class="txt"><span class="ghost" id="g1">TE<br />CACHE</span><span class="ghost" id="g2">TE<br />CACHE</span><span style="position: relative">TE<br />CACHE</span></div>
      </section>
      <section id="p4" class="clip" data-start="1.407" data-duration="0.703" data-track-index="0">
        <svg class="lines" id="l4" viewBox="0 0 1920 2760"></svg>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div id="col">
          <svg viewBox="0 0 48 70">
            <rect x="4" y="2" width="40" height="7" rx="3.5" fill="#fff" />
            <rect x="8.5" y="10" width="31" height="4" rx="2" fill="#fff" opacity="0.9" />
            <rect x="11" y="15.5" width="6" height="43" rx="3" fill="#fff" />
            <rect x="21" y="15.5" width="6" height="43" rx="3" fill="#fff" />
            <rect x="31" y="15.5" width="6" height="43" rx="3" fill="#fff" />
            <rect x="6" y="60" width="36" height="7" rx="3.5" fill="#fff" />
          </svg>
        </div>
        <div id="found" class="abs">On l'a trouvé.</div>
        <div id="brand" class="abs">AnalyseTaCopro</div>
      </section>

      <div id="flash" class="clip" data-start="0" data-duration="2.11" data-track-index="2" data-layout-allow-overlap></div>
    </div>
    <script>
      const BEAT = 60 / 128;
      const rnd = (i, k) => {
        const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453;
        return x - Math.floor(x);
      };
      // Lignes de vitesse (rayonnent du centre)
      const speed = (col) => {
        let s = "";
        for (let i = 0; i < 46; i++) {
          const a = (i / 46) * Math.PI * 2 + rnd(i, 1) * 0.08;
          const r0 = 260 + rnd(i, 2) * 260,
            r1 = 1500;
          s += `<path d="M${960 + Math.cos(a) * r0} ${1380 + Math.sin(a) * r0}L${960 + Math.cos(a) * r1} ${1380 + Math.sin(a) * r1}" stroke="${col}" stroke-width="${6 + rnd(i, 3) * 16}" stroke-linecap="round"/>`;
        }
        return s;
      };
      document.getElementById("l1").innerHTML = speed("#09090d");
      document.getElementById("l2").innerHTML = speed("#ffffff");
      document.getElementById("l3").innerHTML = speed("#ffffff");
      document.getElementById("l4").innerHTML = speed("#ffffff");

      // Image 0 : « CE QUE » déjà plein écran (le coup est déjà parti)
      gsap.set("#p1 .txt", { scale: 1.12, rotation: -3 });
      gsap.set("#col", { y: -900, scaleY: 1.3, transformOrigin: "50% 100%" });
      gsap.set("#found, #brand", { opacity: 0 });

      const tl = gsap.timeline({ paused: true });
      const P = [0, BEAT, BEAT * 2, BEAT * 3];
      const shake = (sel, t, amp, n) => {
        for (let i = 0; i < n; i++) tl.to(sel, { x: (rnd(i, t) - 0.5) * 2 * amp * (1 - i / n), y: (rnd(i, t + 1) - 0.5) * 2 * amp * (1 - i / n), duration: 0.022, ease: "none" }, t + i * 0.022);
        tl.to(sel, { x: 0, y: 0, duration: 0.03 }, t + n * 0.022);
      };
      const flash = (t, a) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.09, ease: "power2.out", immediateRender: false }, t);
      tl.set("#flash", { opacity: 0 }, 0);
      // lignes qui tournent en continu
      ["#l1", "#l2", "#l3", "#l4"].forEach((l, k) => tl.fromTo(l, { rotation: 0 }, { rotation: k % 2 ? -14 : 14, duration: 0.7, ease: "none", transformOrigin: "50% 50%" }, P[k]));

      // 1. CE QUE (jaune) — déjà là à l'image 0, puis petits coups sur les doubles-croches
      tl.to("#p1 .txt", { scale: 1, rotation: 0, duration: 0.12, ease: "power4.out" }, 0);
      tl.to("#p1 .txt", { scale: 1.06, duration: BEAT - 0.12, ease: "none" }, 0.12);
      shake("#p1 .txt", 0, 16, 5);
      // 2. TON FUTUR APPART (noir)
      flash(P[1], 0.8);
      tl.fromTo("#p2 .txt", { scale: 1.4, rotation: 3 }, { scale: 1, rotation: 0, duration: 0.11, ease: "power4.out", immediateRender: false }, P[1]);
      tl.to("#p2 .txt", { scale: 1.07, duration: BEAT - 0.11, ease: "none" }, P[1] + 0.11);
      shake("#p2 .txt", P[1], 18, 5);
      // 3. TE CACHE (rouge, glitch)
      flash(P[2], 0.8);
      tl.fromTo("#p3 .txt", { scale: 1.5 }, { scale: 1, duration: 0.11, ease: "power4.out", immediateRender: false }, P[2]);
      tl.to("#p3 .txt", { scale: 1.08, duration: BEAT - 0.11, ease: "none" }, P[2] + 0.11);
      for (let k = 0; k < 8; k++) {
        tl.set("#g1", { x: (rnd(k, 7) - 0.5) * 50, y: (rnd(k, 8) - 0.5) * 20 }, P[2] + k * (BEAT / 8));
        tl.set("#g2", { x: (rnd(k, 9) - 0.5) * -50, y: (rnd(k, 10) - 0.5) * 20 }, P[2] + k * (BEAT / 8));
      }
      shake("#p3 .txt", P[2], 22, 8);
      // 4. La colonne s'écrase + « On l'a trouvé. » (bleu)
      flash(P[3], 1);
      tl.to("#col", { y: 0, scaleY: 1, duration: 0.09, ease: "power4.in" }, P[3]);
      tl.to("#col", { scaleY: 0.85, scaleX: 1.12, duration: 0.04 }, P[3] + 0.09);
      tl.to("#col", { scaleY: 1, scaleX: 1, duration: 0.3, ease: "elastic.out(1.2, 0.4)" }, P[3] + 0.13);
      tl.fromTo(".ring", { scale: 0.5, opacity: 0.8 }, { scale: (i) => 22 + i * 10, opacity: 0, duration: 0.5, ease: "power2.out", stagger: 0.06, immediateRender: false }, P[3] + 0.09);
      shake("#p4", P[3] + 0.09, 26, 8);
      tl.fromTo("#found", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, ease: "power4.out", immediateRender: false }, P[3] + 0.16);
      tl.fromTo("#brand", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.15, ease: "power3.out", immediateRender: false }, P[3] + 0.26);
      tl.to("#p4 > #col, #found, #brand", { scale: 1.05, duration: 0.4, ease: "none" }, P[3] + 0.3);
      // sortie éclair vers la vidéo
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "power2.in", immediateRender: false }, 2.11 - 0.08);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
